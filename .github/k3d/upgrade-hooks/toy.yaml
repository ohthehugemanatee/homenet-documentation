---
# CI-only stand-in for an app: Ready while /tmp/ready exists, data on a snapshot-capable claim.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: toy
spec:
  replicas: 1
  serviceName: toy
  selector: {matchLabels: {app: toy}}
  template:
    metadata: {labels: {app: toy}}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: toy
          image: busybox:1.37
          command: [sh, -c, "touch /tmp/ready && exec sleep 86400"]
          readinessProbe: {exec: {command: [test, -f, /tmp/ready]}, periodSeconds: 2}
          volumeMounts: [{name: data, mountPath: /data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {storageClassName: csi-hostpath-sc, accessModes: [ReadWriteOnce], resources: {requests: {storage: 16Mi}}}
