name: Lint

'on':
  push:
    branches: [master]
  pull_request:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  yaml:
    name: YAML syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yamllint
        run: pip install yamllint
      - name: Run yamllint
        run: yamllint .

  k8s-manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: v0.7.0
      KUBERNETES_VERSION: 1.29.0
    steps:
      - uses: actions/checkout@v4
      - name: Cache kubeconform binary
        id: cache-kubeconform
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/kubeconform
          key: kubeconform-${{ env.KUBECONFORM_VERSION }}
      - name: Install kubeconform
        if: steps.cache-kubeconform.outputs.cache-hit != 'true'
        run: |
          curl -fsSLo /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
      - name: Cache kubeconform schemas
        uses: actions/cache@v4
        with:
          path: /tmp/kubeconform-cache
          key: kubeconform-schemas-${{ env.KUBERNETES_VERSION }}
      - name: Validate manifests
        # mkdir first: actions/cache only creates the restore path on a hit,
        # and kubeconform's -cache flag errors if the folder doesn't exist yet.
        # Excludes ansible playbooks and helm values (not K8s manifests).
        # --ignore-missing-schemas skips custom CRDs (cert-manager, MetalLB, Longhorn).
        # -cache reuses schemas fetched from the remote JSON Schema Store across
        # runs instead of re-fetching them every time (avoids rate limiting).
        run: |
          mkdir -p /tmp/kubeconform-cache
          find cluster -name "*.yaml" \
            ! -path "*/ansible/*" \
            ! -path "*/helm/*" \
            | xargs kubeconform \
              --ignore-missing-schemas \
              --kubernetes-version "${KUBERNETES_VERSION}" \
              --cache /tmp/kubeconform-cache
      - name: Validate Longhorn recurring jobs
        # --ignore-missing-schemas above skips longhorn.io CRDs entirely (the
        # JSON Schema store has no schema for them), so a RecurringJob with a
        # typo'd task or an empty `groups` lints clean and then schedules
        # nothing. This checks what a schema would have, and asserts each job
        # is in the README table so the two cannot drift (#209).
        run: python3 .github/scripts/check_recurring_jobs.py

  kustomize:
    name: Kustomize builds
    runs-on: ubuntu-latest
    env:
      KUSTOMIZE_VERSION: v5.4.3
    steps:
      - uses: actions/checkout@v4
      - name: Cache kustomize binary
        id: cache-kustomize
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/kustomize
          key: kustomize-${{ env.KUSTOMIZE_VERSION }}
      - name: Install kustomize
        if: steps.cache-kustomize.outputs.cache-hit != 'true'
        run: |
          curl -fsSLo /tmp/kustomize.tar.gz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/kustomize.tar.gz -C /usr/local/bin kustomize
      - name: Print kustomize version
        run: kustomize version
      - name: Build every kustomization
        # ArgoCD runs `kustomize build` at manifest-generation time. The
        # kubeconform job only validates raw YAML and never exercises
        # patches/overlays, so a kustomization that fails to build (bad patch
        # target, missing resource, invalid syntax) passes lint but breaks the
        # live ArgoCD sync. Building each one here reproduces what ArgoCD does
        # and fails CI on the same error.
        run: |
          set -euo pipefail
          find . -name kustomization.yaml -not -path '*/.git/*' -printf '%h\n' \
            | sort -u | while read -r dir; do
              echo "::group::kustomize build ${dir}"
              kustomize build "${dir}"
              echo "::endgroup::"
            done

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: find cluster shoebox -name "*.sh" -exec shellcheck {} +

  github-scripts:
    name: GitHub Actions helper scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests
        run: python3 -m unittest discover -s .github/scripts/tests -v
      - name: Run github-script unit tests
        # Globbed, not `--test <dir>`: node's runner treats every file in a
        # directory named `tests` as a test file, including the Python ones.
        run: node --test .github/scripts/tests/*.test.js
      - name: Assert workspace-reading steps follow a checkout
        # A github-script step that require()s a repo file via github.workspace
        # needs actions/checkout earlier in the same job, or it dies with
        # MODULE_NOT_FOUND at runtime (see #205). No unit test can catch that —
        # the bug is in the workflow wiring, not the script.
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          bad = []
          for f in sorted(glob.glob(".github/workflows/*.yaml")):
              for job_name, job in (yaml.safe_load(open(f)).get("jobs") or {}).items():
                  checked_out = False
                  for step in (job.get("steps") or []):
                      if "actions/checkout" in (step.get("uses") or ""):
                          checked_out = True
                          continue
                      script = (step.get("with") or {}).get("script") or ""
                      if "github.workspace" in script and not checked_out:
                          bad.append(f"{f}:{job_name}:{step.get('name', step.get('uses'))}")
          for entry in bad:
              print(f"BAD :: {entry} reads github.workspace with no preceding actions/checkout")
          sys.exit(1 if bad else 0)
          PY
      - name: Assert no check name has more than one producer
        # Branch protection matches required checks by name. When two producers share
        # a name, the gate races itself and the PR keeps a permanent red check run even
        # after a later green one lands -- and a re-run cannot clear it, because GitHub
        # replays the original event payload (see #236, #245).
        #
        # A producer is either a job whose effective name is the check name, or a
        # checks.create/checks.update call using it. Literal-string match only: a
        # github-script step that builds the name by concatenation would evade this.
        # Nothing in the tree does that today.
        run: |
          python3 - <<'PY'
          import glob, re, sys, yaml
          from collections import defaultdict

          def triggers_on_pull_request(doc):
              # PyYAML reads an unquoted `on:` key as the boolean True, so accept
              # both spellings -- some workflows here quote it, some don't.
              triggers = doc.get("on", doc.get(True)) or {}
              return isinstance(triggers, dict) and "pull_request" in triggers

          producers = defaultdict(list)
          for f in sorted(glob.glob(".github/workflows/*.yaml")):
              doc = yaml.safe_load(open(f)) or {}
              # Only pull_request workflows can post competing check runs onto a PR
              # head SHA. workflow_dispatch-only workflows never race on one.
              if not triggers_on_pull_request(doc):
                  continue
              for job_id, job in (doc.get("jobs") or {}).items():
                  producers[job.get("name") or job_id].append(f"{f}:{job_id} (job)")
                  for step in (job.get("steps") or []):
                      script = (step.get("with") or {}).get("script") or ""
                      # \b keeps `check_name:` out -- that is listForRef looking a
                      # check up, not a step creating one.
                      for name in re.findall(r"""\bname:\s*['"]([^'"]+)['"]""", script):
                          producers[name].append(
                              f"{f}:{job_id}:{step.get('name')} (checks API)")

          bad = {n: p for n, p in producers.items() if len(p) > 1}
          for name, entries in sorted(bad.items()):
              print(f"FAIL :: check name {name!r} has {len(entries)} producers:")
              for e in entries:
                  print(f"          {e}")
          if bad:
              sys.exit(1)
          print(f"OK :: all {len(producers)} PR check names have exactly one producer")
          PY

  ansible:
    name: Ansible playbooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ansible and ansible-lint
        run: pip install ansible ansible-lint
      - name: Install collections
        run: ansible-galaxy collection install -r cluster/ansible/requirements.yaml
      - name: Run ansible-lint
        working-directory: cluster/ansible
        run: |
          ansible-lint k3s-agent.yaml node-state.yaml rolling-upgrade.yaml \
            ../../shoebox/shoebox-ansible-setup.yaml

  policy:
    name: Kubernetes policy (advisory)
    runs-on: ubuntu-latest
    env:
      KUBE_SCORE_VERSION: v1.20.0
    steps:
      - uses: actions/checkout@v4
      - name: Cache kube-score binary
        id: cache-kube-score
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/kube-score
          key: kube-score-${{ env.KUBE_SCORE_VERSION }}
      - name: Install kube-score
        if: steps.cache-kube-score.outputs.cache-hit != 'true'
        run: |
          curl -fsSLo /tmp/kube-score.tar.gz \
            "https://github.com/zegl/kube-score/releases/download/${KUBE_SCORE_VERSION}/kube-score_${KUBE_SCORE_VERSION#v}_linux_amd64.tar.gz"
          tar -xzf /tmp/kube-score.tar.gz -C /usr/local/bin kube-score
      - name: Print kube-score version
        run: kube-score version
      - name: Run kube-score
        # Advisory only (|| true) — many homelab workloads legitimately skip NetworkPolicy,
        # PodDisruptionBudgets, and strict security contexts. Review output and add
        # --ignore-test flags as appropriate when findings are confirmed acceptable.
        run: |
          find cluster -name "*.yaml" \
            ! -path "*/ansible/*" \
            ! -path "*/helm/*" \
            | xargs kube-score score \
              --ignore-test pod-networkpolicy,pod-poddisruptionbudget \
              --output-format ci || true

  polaris:
    name: Kubernetes best practices (Polaris, advisory)
    runs-on: ubuntu-latest
    env:
      POLARIS_VERSION: 9.3.0
    steps:
      - uses: actions/checkout@v4
      - name: Cache polaris binary
        id: cache-polaris
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/polaris
          key: polaris-${{ env.POLARIS_VERSION }}
      - name: Install polaris
        if: steps.cache-polaris.outputs.cache-hit != 'true'
        run: |
          curl -fsSLo /tmp/polaris.tar.gz \
            "https://github.com/FairwindsOps/polaris/releases/download/${POLARIS_VERSION}/polaris_linux_amd64.tar.gz"
          tar -xzf /tmp/polaris.tar.gz -C /usr/local/bin polaris
      - name: Print polaris version
        run: polaris version
      - name: Run polaris audit
        # Advisory only (|| true) — homelab workloads legitimately skip many
        # security best practices. Review output and add exemptions in .polaris.yaml
        # once findings are triaged.
        run: |
          polaris audit \
            --audit-path cluster \
            --format pretty || true

  trivy:
    name: IaC security scan (Trivy)
    runs-on: ubuntu-latest
    env:
      TRIVY_VERSION: 0.71.0
    steps:
      - uses: actions/checkout@v4
      - name: Cache trivy binary
        id: cache-trivy
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/trivy
          key: trivy-${{ env.TRIVY_VERSION }}
      - name: Install trivy
        if: steps.cache-trivy.outputs.cache-hit != 'true'
        run: |
          TARBALL="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSLo "/tmp/${TARBALL}" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${TARBALL}"
          curl -fsSLo /tmp/trivy.checksums \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_checksums.txt"
          grep "${TARBALL}$" /tmp/trivy.checksums | (cd /tmp && sha256sum -c -)
          tar -xzf "/tmp/${TARBALL}" -C /usr/local/bin trivy
      - name: Print trivy version
        run: trivy --version
      - name: Scan k8s manifests for misconfigurations
        run: |
          trivy config \
            --exit-code 1 \
            --severity CRITICAL,HIGH \
            --ignorefile .trivyignore.yaml \
            --skip-files "cluster/services/cert-manager.yaml" \
            cluster
