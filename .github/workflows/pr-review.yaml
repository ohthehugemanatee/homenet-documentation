name: AI Infrastructure Review

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: string

concurrency:
  group: pr-review-${{ inputs.pr_number || github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  contents: read

jobs:
  review:
    # This job's own check run IS the branch-protection gate. A pull_request-triggered
    # job emits a check bound to the SHA it ran on, so nothing needs to mirror the
    # result onto the PR head. The name must stay exactly as branch protection has it.
    name: AI review required
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check skip conditions
        id: skip-check
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
        run: |
          # Skip if commit message contains [skip-review] or [no-review]
          COMMIT_MSG=$(git log -1 --pretty=%B)
          if echo "$COMMIT_MSG" | grep -qE '\[(skip-review|no-review)\]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping review: [skip-review] marker in commit message"
            exit 0
          fi

          # Skip if all changed files are documentation
          CHANGED=$(gh pr view "$PR_NUMBER" \
            --json files --jq '[.files[].path]')
          TOTAL=$(echo "$CHANGED" | jq 'length')
          DOCS=$(echo "$CHANGED" | \
            jq '[.[] | select(test("\\.(md|txt|rst)$|^docs/|README") and (test("(^|/)CLAUDE\\.md$|(^|/)AGENTS\\.md$") | not))] | length')
          if [ "$TOTAL" -gt 0 ] && [ "$TOTAL" -eq "$DOCS" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping review: docs-only change ($TOTAL files)"
            exit 0
          fi

          # Skip if the diff is too small (<20 changed lines)
          DIFF_LINES=$(gh pr diff "$PR_NUMBER" | \
            grep -cE '^[+-][^+-]' || true)
          if [ "$DIFF_LINES" -lt 20 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping review: diff too small (${DIFF_LINES} changed lines)"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Get PR diff
        if: steps.skip-check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
        run: gh pr diff "$PR_NUMBER" > /tmp/pr.diff

      - name: Review with Claude
        if: steps.skip-check.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          python3 << 'PYEOF'
          import json
          import os
          import subprocess
          import sys
          import urllib.request
          import urllib.error

          # The block/pass rule lives in a module so it can be unit-tested;
          # see .github/scripts/tests/test_review_verdict.py.
          sys.path.insert(0, '.github/scripts')
          from review_verdict import decide_verdict, render_findings
          from review_exceptions import exceptions_for_paths, touched_paths
          from review_api import ReviewError, build_request, extract_report, usage_line

          with open('/tmp/pr.diff') as f:
              diff = f.read()

          if not diff.strip():
              print('Empty diff, skipping review')
              sys.exit(0)

          # Taken before truncation so a file cut from the prompt still scopes its exceptions.
          touched = touched_paths(diff)

          MAX_CHARS = 80000
          truncated = False
          if len(diff) > MAX_CHARS:
              cut = diff.rfind('\n', 0, MAX_CHARS)
              diff = diff[:cut if cut > 0 else MAX_CHARS]
              truncated = True

          # --- Load the known exceptions that apply to the touched paths ---
          exceptions_context = ''
          exceptions_path = '.github/agentic-review-exceptions.yaml'
          if os.path.exists(exceptions_path):
              with open(exceptions_path) as f:
                  exceptions_text, kept, total = exceptions_for_paths(f.read(), touched)
              sent = 'all, file did not parse' if kept is None else f'{kept} of {total}'
              print(f'Exceptions sent: {sent}')
              if exceptions_text:
                  exceptions_context = (
                      '\n\n## Known exceptions — do not re-raise\n\n'
                      'The following findings have been reviewed and intentionally accepted '
                      'by the maintainer. Do not raise them again:\n\n'
                      '```yaml\n' + exceptions_text + '\n```'
                  )

          # --- Fetch prior review comments on this PR ---
          prior_comments_context = ''
          pr_number = os.environ['PR_NUMBER']
          repo = os.environ['REPO']
          try:
              result = subprocess.run(
                  ['gh', 'api', f'/repos/{repo}/issues/{pr_number}/comments',
                   '--jq',
                   '[.[] | select(.body | startswith("## AI Infrastructure Review"))'
                   ' | .body] | join("\n---\n")'],
                  capture_output=True, text=True, timeout=30
              )
              if result.returncode == 0 and result.stdout.strip():
                  prior = result.stdout.strip()[:8000]
                  prior_comments_context = (
                      '\n\n## Prior AI reviews on this PR\n\n'
                      'These findings were already posted in previous review rounds. '
                      'Do not duplicate anything substantively the same:\n\n'
                      + prior
                  )
          except Exception as e:
              print(f'Warning: could not fetch prior comments: {e}')

          fence = '```'
          trunc_note = '\n\n*(diff truncated due to size)*' if truncated else ''
          prompt = (
              'Review this infrastructure pull request using the following process.'
              ' Report your result as the JSON object the response schema defines — that is your only output.\n\n'
              'Put the human-readable review in `review_markdown`: the AI-Specific Validation (step 3),'
              ' the Final Review (step 5), and the completed Verification Checklist.'
              ' Steps 1, 2, and 4 are internal reasoning — leave them out.\n\n'
              'Put every concrete issue in `findings`, one entry each. `findings` drives the merge gate:'
              ' a HIGH finding with High or Medium confidence blocks the PR. Reserve HIGH for problems that'
              ' should genuinely stop a merge — a real security hole, data loss, or a break in cluster'
              ' behaviour. Style preferences, speculative concerns, and anything already listed under'
              ' known exceptions are not findings at all; a comment-budget overrun is the one style'
              ' issue to report, at MEDIUM or LOW. An empty `findings` list is the correct and'
              ' expected result for a clean PR.\n\n'
              '**Review Process (steps 1, 2, 4 are internal only):**\n\n'
              '1. **Initial Analysis** *(internal)* — Review for semantic gaps: reliability and idempotency,'
              ' configuration intent, operational concerns, rollback feasibility, and documentation drift.\n\n'
              '2. **Gather Findings** *(internal)* — For each issue note:'
              ' `[SEVERITY: HIGH/MEDIUM/LOW] Issue description`\n'
              '   Only actual issues, not style preferences.\n\n'
              '3. **AI-Specific Validation** *(emit this section)* — For each item below report a finding or explicitly'
              ' state "no issue found" so the human reviewer can confirm the check ran:\n'
              '   - *Omission Check*: Did the change omit required behavior, tests, docs, or rollback steps'
              ' implied by the PR description or touched files?\n'
              '   - *Logic Check*: Is there a subtle logic error — inverted condition, `==` vs `in`, off-by-one,'
              ' short-circuit evaluation trap?\n'
              '   - *Idempotency Check*: Does an Ansible task, controller config, or workflow step create'
              ' repeated side effects when it runs twice?\n'
              '   - *Dependency Check*: Are all new packages/modules real and verifiable? Flag anything that cannot'
              ' be confirmed in the diff or known package registries.\n'
              '   - *Context Check*: Did the change introduce a dangerous shortcut (`eval()`, disabled auth,'
              ' `--no-verify`, `set +e`, `|| true` masking failures) that violates the security posture?\n'
              '   - *Drift Check*: Did the change touch infrastructure, workflow, or documentation areas'
              ' outside the PR\'s declared scope?\n'
              '   - *Doc Drift Check*: Do changed docs contradict manifests, Ansible, workflows, or scripts?\n'
              '   - *Rollback Check*: Is the stated rollback path real for the resources changed?\n'
              '   - *Comment Budget Check*: Count added comment, docstring, and prose-doc lines against added code lines.'
              ' Flag comments that narrate the incident, Issue, or PR behind the change, rationale that restates what the code'
              ' already says, and doc edits the change did not make necessary. Verbosity is never HIGH.\n\n'
              '4. **Verify Your Findings** *(internal)* — Verify your gathered findings:\n'
              '   - Are reliability/idempotency concerns accurate?\n'
              '   - Did I verify rerunning the changed tasks or workflows has no unintended side effects?\n'
              '   - Did I check docs against the changed implementation?\n'
              '   - Did I verify the rollback path against the resources changed?\n'
              '   - Did I miss any edge cases?\n'
              '   - Are my recommendations actually feasible in this K8s/Ansible homelab context?\n\n'
              '5. **Final Review** *(emit this section)* — Present your verified findings with confidence levels:\n'
              '   Format: `[SEVERITY: HIGH/MEDIUM/LOW] [Confidence: High/Medium/Low] Issue description`\n'
              '   If no issues were found, state that explicitly.\n\n'
              '**Verification Checklist** *(emit this section, mark each checked)*:\n'
              '- [ ] Checked semantic omissions against the PR description and touched files\n'
              '- [ ] Reviewed reliability and idempotency\n'
              '- [ ] Checked docs against the changed implementation\n'
              '- [ ] Verified the rollback path is feasible\n'
              '- [ ] Validated configuration quality\n'
              '- [ ] Confirmed operational concerns addressed\n'
              '- [ ] Reviewed documentation completeness\n'
              '- [ ] Confirmed recommendations are implementable in this environment\n'
              + exceptions_context
              + prior_comments_context
              + '\n\n## Pull request diff\n\n'
              + fence + 'diff\n' + diff + '\n' + fence + trunc_note
          )

          print(f'Prompt length: {len(prompt)} chars')

          # Structured output rather than parsing severities out of prose: the
          # prompt itself contains the literal string "HIGH/MEDIUM/LOW", so any
          # regex over the response text is unreliable.
          payload = json.dumps(build_request(prompt)).encode()

          req = urllib.request.Request(
              'https://api.anthropic.com/v1/messages',
              data=payload,
              headers={
                  'x-api-key': os.environ['ANTHROPIC_API_KEY'],
                  'anthropic-version': '2023-06-01',
                  'content-type': 'application/json',
              }
          )

          try:
              with urllib.request.urlopen(req, timeout=300) as resp:
                  result = json.loads(resp.read())
          except urllib.error.HTTPError as e:
              print(f'API error {e.code}: {e.read().decode()}')
              sys.exit(1)
          except Exception as e:
              print(f'Request failed: {e}')
              sys.exit(1)

          if result.get('type') == 'error':
              print(f"API returned error: {result.get('error')}")
              sys.exit(1)

          usage = usage_line(result.get('usage'))
          print(usage)
          if os.environ.get('GITHUB_STEP_SUMMARY'):
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
                  f.write(usage + '\n')

          # A truncated or refused reply means the findings list is incomplete, so a
          # clean-looking result would be a lie. Treat it as the reviewer failing
          # to run, not as a pass.
          try:
              findings, review = extract_report(result)
          except ReviewError as e:
              print(e)
              sys.exit(1)

          blocking, reason = decide_verdict(findings)
          print(reason)

          # Escape hatch for a false-positive HIGH, mirroring pr-size-gate's
          # size/override. The review is still posted; only the gate is waived.
          overridden = False
          if blocking:
              try:
                  labels = subprocess.run(
                      ['gh', 'pr', 'view', pr_number, '--repo', repo,
                       '--json', 'labels', '--jq', '[.labels[].name]'],
                      capture_output=True, text=True, timeout=30, check=True
                  ).stdout
                  overridden = 'review/override' in json.loads(labels or '[]')
              except Exception as e:
                  # Fail closed: if we cannot read the labels we cannot honour
                  # an override, so the blocking finding stands.
                  print(f'Warning: could not read PR labels, override not applied: {e}')

          if blocking and overridden:
              banner = (f'> **Gate overridden.** {reason}\n>\n'
                        '> The `review/override` label is present, so this does not block merge.')
          elif blocking:
              banner = (f'> **This review blocks merge.** {reason}\n>\n'
                        '> Fix the finding, or add the `review/override` label if it is a false positive.'
                        ' Recurring false positives belong in `.github/agentic-review-exceptions.yaml`.')
          else:
              banner = f'> {reason}'

          body = ('## AI Infrastructure Review\n\n'
                  + banner + '\n\n'
                  + review
                  + '\n\n### Findings\n\n' + render_findings(findings)
                  + '\n\n---\n*Automated review by Claude*')

          with open('/tmp/review.md', 'w') as f:
              f.write(body)

          subprocess.run(
              ['gh', 'pr', 'comment', pr_number,
               '--body-file', '/tmp/review.md',
               '--repo', repo],
              check=True
          )
          print('Review posted successfully')

          if blocking and not overridden:
              sys.exit(1)
          PYEOF
