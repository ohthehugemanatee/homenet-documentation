name: Build SongHub image

# Manual only: SongHub (https://github.com/Cesc1986/SongHub) ships no
# published image, so we build it ourselves from a pinned upstream tag and
# push to GHCR. No schedule/auto-trigger — bumping songhub_ref is a
# deliberate, reviewable action, same spirit as the exact image pins used
# for cluster/services/unifi/mongodb.yaml and mariadb.yaml.
#
# songhub_repo defaults to upstream but can be overridden to build a fork
# branch (e.g. a local patch awaiting upstream merge). Only the default
# repo gets the `:latest` tag, so a fork build never clobbers it.
'on':
  workflow_dispatch:
    inputs:
      songhub_repo:
        description: 'SongHub GitHub repo to build (owner/repo) — override to build a fork/patch branch'
        required: true
        default: Cesc1986/SongHub
      songhub_ref:
        description: 'Git ref to build (tag preferred over branch)'
        required: true
        default: v1.7

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and push to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout SongHub at pinned ref
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.songhub_repo }}
          ref: ${{ inputs.songhub_ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Branch refs can contain slashes, which aren't valid in a Docker tag.
      - name: Compute image tags
        id: tags
        run: |
          ref_tag=$(echo '${{ inputs.songhub_ref }}' | tr '/' '-')
          {
            echo 'tags<<EOF'
            echo "ghcr.io/ohthehugemanatee/songhub:${ref_tag}"
            if [ '${{ inputs.songhub_repo }}' = 'Cesc1986/SongHub' ]; then
              echo "ghcr.io/ohthehugemanatee/songhub:latest"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # linux/amd64 only: the cluster's arm64 nodes are tainted
      # control-plane-only, so untolerated workload pods (like this one)
      # only ever schedule on the amd64 nodes. No multi-arch/QEMU needed.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}

      # GHCR packages default to private. The cluster (and the songhub
      # test-cluster.yaml CI step) has no imagePullSecret configured, so
      # this package must be made public one time in GHCR package settings
      # (or an imagePullSecret added) before the image is pullable.
      - name: Note on package visibility
        run: |
          echo "If this is the first push, set the ghcr.io/ohthehugemanatee/songhub"
          echo "package visibility to public in GitHub package settings, or"
          echo "configure an imagePullSecret in cluster/services/songhub.yaml."
