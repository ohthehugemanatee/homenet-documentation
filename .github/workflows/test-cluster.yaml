name: Cluster smoke tests

'on':
  push:
    branches: [master]
  pull_request:

concurrency:
  group: test-cluster-${{ github.ref }}
  cancel-in-progress: true

jobs:

  dry-run:
    name: k3d dry-run
    runs-on: ubuntu-latest
    env:
      K3D_VERSION: v5.7.5

    steps:
      - uses: actions/checkout@v4

      - name: Cache k3d binary
        id: cache-k3d
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/k3d
          key: k3d-${{ env.K3D_VERSION }}

      - name: Install k3d
        if: steps.cache-k3d.outputs.cache-hit != 'true'
        run: |
          curl -fsSLo /tmp/k3d \
            "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/k3d-linux-amd64"
          install -m 755 /tmp/k3d /usr/local/bin/k3d

      - name: Print k3d version
        run: k3d version

      - name: Create k3d cluster
        run: k3d cluster create ci --wait --no-lb

      - name: Resolve pinned cert-manager chart version
        run: |
          # Read the pin out of the Application rather than repeating it here, so
          # CI cannot silently exercise a different chart than ArgoCD deploys.
          python3 - <<'PY' >> "$GITHUB_ENV"
          import yaml
          app = yaml.safe_load(open("cluster/argocd/apps/cert-manager.yaml"))
          ver = next(s["targetRevision"] for s in app["spec"]["sources"]
                     if s.get("chart") == "cert-manager")
          print(f"CM_VERSION={ver}")
          PY

      - name: Install cert-manager via helm (version and values from git)
        run: |
          echo "cert-manager chart version: ${CM_VERSION}"
          helm repo add jetstack https://charts.jetstack.io
          helm repo update
          helm install cert-manager jetstack/cert-manager \
            --namespace cert-manager \
            --create-namespace \
            --version "${CM_VERSION}" \
            --values cluster/helm/cert-manager/values.yaml \
            --wait

      - name: Wait for cert-manager webhook
        run: |
          kubectl rollout status deployment/cert-manager-webhook \
            -n cert-manager --timeout=120s

      - name: Assert cert-manager stays on the manual-sync infra tier
        run: |
          # cert-manager is Tier C in #206: manually gated indefinitely. Auto-sync
          # would let an unattended chart bump replace the component every TLS
          # certificate in the cluster depends on, and a finalizer would let an
          # Application delete cascade into the CRDs.
          python3 - <<'PY'
          import re, sys, yaml
          app = yaml.safe_load(open("cluster/argocd/apps/cert-manager.yaml"))
          errs = []
          if "automated" in app["spec"].get("syncPolicy", {}):
              errs.append("syncPolicy.automated is set; cert-manager must stay manual-sync")
          if app["metadata"].get("finalizers"):
              errs.append("finalizer present; an Application delete would cascade to the CRDs")
          anns = app["metadata"].get("annotations", {})
          if "notifications.argoproj.io/subscribe.on-out-of-sync.pushover" not in anns:
              errs.append("missing on-out-of-sync Pushover annotation required of manual-sync apps")
          chart = next((s for s in app["spec"]["sources"] if s.get("chart") == "cert-manager"), None)
          if chart is None:
              errs.append("no cert-manager chart source found")
          elif not re.fullmatch(r"v\d+\.\d+\.\d+", str(chart.get("targetRevision", ""))):
              errs.append(f"chart version {chart.get('targetRevision')!r} is not an exact pin")
          if "ServerSideApply=true" not in app["spec"]["syncPolicy"].get("syncOptions", []):
              errs.append("ServerSideApply=true required; cert-manager CRDs exceed the client-side apply limit")
          for e in errs:
              print(f"FAILED: {e}")
          sys.exit(1 if errs else 0)
          PY

      - name: Verify cert-manager issues a certificate under our values
        run: |
          # Proves the values file yields a cert-manager that actually works, not
          # just one that reaches Ready. A self-signed issuer keeps this off the
          # network — the ACME path needs real DNS and cannot run in k3d.
          kubectl apply -f - <<'EOF'
          apiVersion: cert-manager.io/v1
          kind: ClusterIssuer
          metadata:
            name: ci-selfsigned
          spec:
            selfSigned: {}
          ---
          apiVersion: cert-manager.io/v1
          kind: Certificate
          metadata:
            name: ci-smoke
            namespace: default
          spec:
            secretName: ci-smoke-tls
            dnsNames:
              - ci-smoke.example.com
            issuerRef:
              name: ci-selfsigned
              kind: ClusterIssuer
          EOF
          kubectl wait --for=condition=Ready certificate/ci-smoke \
            -n default --timeout=120s
          kubectl -n default get secret ci-smoke-tls -o name
          kubectl delete certificate/ci-smoke -n default
          kubectl delete clusterissuer/ci-selfsigned

      - name: Seed cluster state (namespaces, priority classes)
        run: |
          for ns in argocd collabora unifi octoprint monitoring longhorn-system dns-bg-check; do
            kubectl create namespace "$ns" --dry-run=client -o yaml | kubectl apply -f -
          done
          kubectl apply -f cluster/priorityClasses/

      - name: Apply and verify claude-remote-debug RBAC (read-only auth matrix)
        run: |
          kubectl apply -f cluster/services/claude-remote-debug-rbac.yaml
          SA=system:serviceaccount:default:claude-remote-debug
          test "$(kubectl auth can-i list pods --as="$SA")" = yes
          test "$(kubectl auth can-i get pods/log --as="$SA")" = yes
          test "$(kubectl auth can-i list events --as="$SA" -A)" = yes
          test "$(kubectl auth can-i get secrets --as="$SA" -A)" = no
          test "$(kubectl auth can-i create pods/exec --as="$SA")" = no
          test "$(kubectl auth can-i delete pods --as="$SA")" = no
          echo "claude-remote-debug auth matrix OK"

      - name: Install kubernetes-mcp-server (real, read-only smoke test)
        run: |
          helm upgrade --install kubernetes-mcp-server \
            oci://ghcr.io/containers/charts/kubernetes-mcp-server --version 0.1.0 \
            --namespace default \
            -f cluster/helm/kubernetes-mcp-server/values.yaml \
            --wait --timeout 90s

      - name: Verify kubernetes-mcp-server rollout
        run: |
          kubectl wait --for=condition=Ready pod \
            -l app.kubernetes.io/name=kubernetes-mcp-server \
            -n default --timeout=90s

      - name: Verify kubernetes-mcp-server is read-only (no destructive tools registered)
        run: |
          kubectl -n default port-forward svc/kubernetes-mcp-server 8080:8080 &
          PF_PID=$!
          trap 'kill $PF_PID' EXIT
          for i in $(seq 1 10); do
            curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1 && break
            sleep 1
          done

          INIT_PAYLOAD='{"jsonrpc":"2.0","id":1,"method":"initialize",'
          INIT_PAYLOAD+='"params":{"protocolVersion":"2025-06-18","capabilities":{},'
          INIT_PAYLOAD+='"clientInfo":{"name":"test-cluster-ci","version":"0.0.0"}}}'

          INIT_HEADERS=$(mktemp)
          INIT_BODY=$(curl -sS -D "$INIT_HEADERS" -X POST http://127.0.0.1:8080/mcp \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d "$INIT_PAYLOAD")
          echo "== initialize response headers =="; cat "$INIT_HEADERS"
          echo "== initialize response body =="; echo "$INIT_BODY"
          echo "$INIT_BODY" | grep -q '"protocolVersion"' \
            || { echo "FAILED: initialize did not return protocolVersion"; exit 1; }

          # Streamable-HTTP transport: the server may assign a session that
          # subsequent requests must echo back via this header.
          SESSION_ID=$(grep -i '^Mcp-Session-Id:' "$INIT_HEADERS" | tr -d '\r' | cut -d' ' -f2-)
          SESSION_HEADER=()
          [ -n "$SESSION_ID" ] && SESSION_HEADER=(-H "Mcp-Session-Id: $SESSION_ID")

          # Spec requires this notification before further requests on a
          # freshly initialized session; harmless to send even if unused.
          curl -sS -X POST http://127.0.0.1:8080/mcp \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            "${SESSION_HEADER[@]}" \
            -d '{"jsonrpc":"2.0","method":"notifications/initialized","params":{}}' >/dev/null

          TOOLS_BODY=$(curl -sS -X POST http://127.0.0.1:8080/mcp \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            "${SESSION_HEADER[@]}" \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}')
          echo "== tools/list response body =="; echo "$TOOLS_BODY"
          echo "$TOOLS_BODY" | grep -q '"pods_list"' \
            || { echo "FAILED: pods_list not found in tools/list response"; exit 1; }

          # Primary check: no tool the server itself marks destructive.
          # Belt-and-suspenders: also reject the known exec tool by name, in
          # case a future upstream version omits the annotation.
          if echo "$TOOLS_BODY" | grep -q '"destructiveHint":[[:space:]]*true'; then
            echo "FAILED: a tool with destructiveHint:true is registered despite --read-only"
            exit 1
          fi
          if echo "$TOOLS_BODY" | grep -q '"pods_exec"'; then
            echo "FAILED: pods_exec is registered despite --read-only"
            exit 1
          fi
          echo "kubernetes-mcp-server read-only tool surface OK"

      - name: Add nextcloud-mcp-server helm repo
        run: |
          helm repo add nextcloud-mcp https://cbcoutinho.github.io/helm-charts
          helm repo update

      - name: Create nextcloud-mcp-oauth fixture secret
        run: |
          # Must be a real Fernet key or the server raises on startup.
          # Fernet.generate_key() is just urlsafe-base64 of 32 random bytes, so
          # stdlib produces a valid one without installing cryptography.
          FERNET_KEY=$(python3 -c \
            'import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')
          kubectl create secret generic nextcloud-mcp-oauth \
            --from-literal=token_encryption_key="$FERNET_KEY" \
            --from-literal=client_id=ci-test-client \
            --from-literal=client_secret=ci-test-secret \
            -n default

      - name: Create longhorn StorageClass alias
        run: |
          # login-flow puts the token DB on a storageClass longhorn PVC, which
          # k3d has no provisioner for. Alias it onto k3d's local-path so the
          # smoke test exercises the real PVC path.
          kubectl apply -f - <<'EOF'
          apiVersion: storage.k8s.io/v1
          kind: StorageClass
          metadata:
            name: longhorn
          provisioner: rancher.io/local-path
          volumeBindingMode: WaitForFirstConsumer
          reclaimPolicy: Delete
          EOF

      - name: Deploy OIDC discovery stub
        run: |
          # login-flow does OIDC discovery at startup and treats 4xx as a config
          # error (no retry), so the Pod cannot boot without an IdP — and CI must
          # not reach production Nextcloud for one. Discovery is the only hard
          # startup dependency (JWKS is fetched lazily), so a static document is
          # enough. issuer matches the stub URL to select integrated mode;
          # registration_endpoint is omitted to keep CI off the DCR path.
          JSON='{"issuer":"http://oidc-stub.default.svc",
          "authorization_endpoint":"http://oidc-stub.default.svc/authorize",
          "token_endpoint":"http://oidc-stub.default.svc/token",
          "userinfo_endpoint":"http://oidc-stub.default.svc/userinfo",
          "jwks_uri":"http://oidc-stub.default.svc/jwks",
          "code_challenge_methods_supported":["S256"]}'
          # base64 so the JSON's quotes survive the nested sh -c unmangled.
          B64=$(printf '%s' "$JSON" | tr -d '\n' | base64 -w0)
          kubectl create deployment oidc-stub -n default --image=python:3.12-alpine -- \
            sh -c "mkdir -p /w/.well-known && echo $B64 | base64 -d > /w/.well-known/openid-configuration && cd /w && exec python3 -m http.server 80"
          kubectl expose deployment oidc-stub -n default --port=80 --target-port=80
          kubectl rollout status deployment/oidc-stub -n default --timeout=120s

      - name: Install nextcloud-mcp-server (real smoke test)
        run: |
          # nextcloud.host overridden to the stub: CI must not depend on
          # production Nextcloud. Everything else comes from the real values
          # file. 180s because PVC provisioning now precedes the image pull.
          helm upgrade --install nextcloud-mcp \
            nextcloud-mcp/nextcloud-mcp-server --version 0.102.7 \
            --namespace default \
            -f cluster/helm/nextcloud-mcp-server/values.yaml \
            --set nextcloud.host=http://oidc-stub.default.svc \
            --wait --timeout 180s

      - name: Diagnose nextcloud-mcp-server failure
        if: failure()
        run: |
          # helm --wait only reports "context deadline exceeded"; dump what
          # distinguishes unbound PVC / crash-loop / slow pull. describe covers
          # pod, volume and PVC state; --previous catches a crash-loop's cause.
          SEL="-l app.kubernetes.io/name=nextcloud-mcp-server"
          kubectl -n default describe pod $SEL
          echo "=== logs ==="
          kubectl -n default logs $SEL --tail=200 --all-containers || true
          echo "=== logs (previous) ==="
          kubectl -n default logs $SEL --tail=200 --all-containers --previous || true
          echo "=== events ==="
          kubectl -n default get events --sort-by=.lastTimestamp | tail -40

      - name: Verify nextcloud-mcp-server rollout
        run: |
          kubectl wait --for=condition=Ready pod \
            -l app.kubernetes.io/name=nextcloud-mcp-server \
            -n default --timeout=90s

      - name: Verify nextcloud-mcp-server health and OAuth routes
        run: |
          kubectl -n default port-forward svc/nextcloud-mcp-nextcloud-mcp-server 8000:8000 &
          PF_PID=$!
          trap 'kill $PF_PID' EXIT
          for i in $(seq 1 10); do
            curl -fsS http://127.0.0.1:8000/health/live >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health/live
          echo "nextcloud-mcp-server health/live OK"

          # Guards the reported bug: auth.mode basic registers no OAuth routes,
          # so claude.ai's Connectors UI 404s on discovery and cannot connect.
          # Asserts registered, not 200 — the handler's response depends on the
          # stubbed IdP. The end-to-end 200 is the Verify: in nextcloud-mcp.md.
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
            http://127.0.0.1:8000/.well-known/oauth-authorization-server)
          echo "oauth-authorization-server status: $STATUS"
          if [ "$STATUS" = "404" ]; then
            echo "FAILED: /.well-known/oauth-authorization-server is not registered"
            echo "        (expected the OAuth facade from auth.mode: login-flow)"
            exit 1
          fi
          echo "nextcloud-mcp-server OAuth routes registered OK"

          # Mounting the routes is not enough: the server keeps a separate
          # allowlist of MCP clients (ALLOWED_MCP_CLIENTS) and fail-closes with
          # 401 "Unknown client_id" when it is unset, which is what blocked the
          # claude.ai connector. Assert an allowlisted client gets past client
          # validation — a redirect to the IdP, not a 401.
          AUTH="http://127.0.0.1:8000/oauth/authorize?response_type=code"
          AUTH="$AUTH&client_id=claude-ai"
          AUTH="$AUTH&redirect_uri=https%3A%2F%2Fclaude.ai%2Fapi%2Fmcp%2Fauth_callback"
          AUTH="$AUTH&code_challenge=ci0000000000000000000000000000000000000000000"
          AUTH="$AUTH&code_challenge_method=S256&state=ci&scope=openid"
          # Require the 302 specifically, not just "not 401": the handler's only
          # success path is RedirectResponse(status_code=302), so 5xx from a
          # broken discovery would otherwise pass this check silently.
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' "$AUTH")
          echo "oauth/authorize status: $STATUS"
          if [ "$STATUS" != "302" ]; then
            echo "FAILED: expected 302 redirect to the IdP, got $STATUS"
            echo "        401 = client_id not in ALLOWED_MCP_CLIENTS, or its"
            echo "              registered redirect URI does not match"
            echo "        5xx = OIDC discovery against the IdP is failing"
            exit 1
          fi
          echo "nextcloud-mcp-server MCP client allowlist OK"

      - name: Install nextcloud-mcp-basic (real smoke test)
        run: |
          # Second release of the same chart, auth.mode multi-user-basic. Shares
          # the oidc-stub host so CI never reaches production Nextcloud. 120s,
          # not 180s: this release is stateless, so no PVC provisioning precedes
          # the image pull. No fixture secret — offline access is off.
          helm upgrade --install nextcloud-mcp-basic \
            nextcloud-mcp/nextcloud-mcp-server --version 0.102.7 \
            --namespace default \
            -f cluster/helm/nextcloud-mcp-basic/values.yaml \
            --set nextcloud.host=http://oidc-stub.default.svc \
            --wait --timeout 120s

      - name: Diagnose nextcloud-mcp-basic failure
        if: failure()
        run: |
          # Selects on instance, not name: app.kubernetes.io/name is
          # nextcloud-mcp-server for both releases now.
          SEL="-l app.kubernetes.io/instance=nextcloud-mcp-basic"
          kubectl -n default describe pod $SEL
          echo "=== logs ==="
          kubectl -n default logs $SEL --tail=200 --all-containers || true
          echo "=== logs (previous) ==="
          kubectl -n default logs $SEL --tail=200 --all-containers --previous || true
          echo "=== events ==="
          kubectl -n default get events --sort-by=.lastTimestamp | tail -40

      - name: Verify nextcloud-mcp-basic rollout
        run: |
          kubectl wait --for=condition=Ready pod \
            -l app.kubernetes.io/instance=nextcloud-mcp-basic \
            -n default --timeout=90s

      - name: Verify nextcloud-mcp-basic deployment mode
        run: |
          # The values file selecting the wrong mode is silent otherwise: a
          # fallback to auth.mode basic would still boot and still pass the
          # health check, but would serve every client as one shared account.
          MODE=$(kubectl -n default get deploy nextcloud-mcp-basic-nextcloud-mcp-server \
            -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="MCP_DEPLOYMENT_MODE")].value}')
          echo "MCP_DEPLOYMENT_MODE: $MODE"
          if [ "$MODE" != "multi_user_basic" ]; then
            echo "FAILED: expected multi_user_basic, got '$MODE'"
            exit 1
          fi

          # Statelessness is what justifies this release's auto-sync tier and
          # its lack of a token_encryption_key. enableOfflineAccess or
          # dataStorage creeping back on would produce a PVC here.
          PVCS=$(kubectl -n default get pvc \
            -l app.kubernetes.io/instance=nextcloud-mcp-basic \
            -o name)
          if [ -n "$PVCS" ]; then
            echo "FAILED: expected no PVC, got: $PVCS"
            exit 1
          fi
          echo "nextcloud-mcp-basic mode and statelessness OK"

      - name: Verify nextcloud-mcp-basic credential handling
        run: |
          # 8001 so this cannot collide with the login-flow release's forward.
          kubectl -n default port-forward \
            svc/nextcloud-mcp-basic-nextcloud-mcp-server 8001:8000 &
          PF_PID=$!
          trap 'kill $PF_PID' EXIT
          for i in $(seq 1 10); do
            curl -fsS http://127.0.0.1:8001/health/live >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8001/health/live
          echo
          echo "nextcloud-mcp-basic health/live OK"

          # This mode does not challenge at the edge. BasicAuthMiddleware only
          # extracts an Authorization header when one is present and always
          # continues the chain — no 401, no WWW-Authenticate — so the MCP
          # handshake is reachable without credentials and enforcement happens
          # per-operation, when a tool builds its Nextcloud client. A bare
          # GET /mcp is 406 (content negotiation) and proves nothing either
          # way. Printed for the record; see nextcloud-mcp.md.
          echo "=== unauthenticated tools/list (informational) ==="
          curl -s -X POST http://127.0.0.1:8001/mcp \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
            -w '\nHTTP %{http_code}\n' | head -20

          # The gate: an unauthenticated tool call must never come back as a
          # JSON-RPC success. This is a floor, not proof of enforcement — a
          # transport-level rejection (missing session, unknown tool) also
          # errors and passes. It cannot pass on the failure that matters,
          # which is an anonymous caller getting a real Nextcloud result.
          BODY=$(curl -s -X POST http://127.0.0.1:8001/mcp \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"nc_notes_search_notes","arguments":{"query":"ci"}}}')
          echo "=== unauthenticated tools/call ==="
          printf '%s\n' "$BODY" | head -20
          if printf '%s' "$BODY" | grep -q '"result"' \
             && ! printf '%s' "$BODY" | grep -q '"error"'; then
            echo "FAILED: unauthenticated tool call returned a JSON-RPC result"
            echo "        an anonymous caller reached Nextcloud through this pod"
            exit 1
          fi
          echo "nextcloud-mcp-basic credential handling OK"

      - name: Verify nextcloud-mcp-basic tool surface
        run: |
          # mcp.extraArgs restricts this release to webdav/notes/deck. Nothing
          # else surfaces the setting: a dropped or misspelled --enable-app
          # still boots, still passes health/live, and quietly re-registers all
          # twelve apps. Only tools/list can tell the difference.
          kubectl -n default port-forward \
            svc/nextcloud-mcp-basic-nextcloud-mcp-server 8002:8000 &
          PF_PID=$!
          trap 'kill $PF_PID' EXIT
          for i in $(seq 1 10); do
            curl -fsS http://127.0.0.1:8002/health/live >/dev/null 2>&1 && break
            sleep 1
          done

          INIT_PAYLOAD='{"jsonrpc":"2.0","id":1,"method":"initialize",'
          INIT_PAYLOAD+='"params":{"protocolVersion":"2025-06-18","capabilities":{},'
          INIT_PAYLOAD+='"clientInfo":{"name":"test-cluster-ci","version":"0.0.0"}}}'

          INIT_HEADERS=$(mktemp)
          curl -sS -D "$INIT_HEADERS" -X POST http://127.0.0.1:8002/mcp \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d "$INIT_PAYLOAD" >/dev/null

          # Streamable-HTTP assigns a session that later requests must echo.
          SESSION_ID=$(grep -i '^Mcp-Session-Id:' "$INIT_HEADERS" | tr -d '\r' | cut -d' ' -f2-)
          SESSION_HEADER=()
          [ -n "$SESSION_ID" ] && SESSION_HEADER=(-H "Mcp-Session-Id: $SESSION_ID")

          curl -sS -X POST http://127.0.0.1:8002/mcp \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            "${SESSION_HEADER[@]}" \
            -d '{"jsonrpc":"2.0","method":"notifications/initialized","params":{}}' >/dev/null

          TOOLS=$(curl -sS -X POST http://127.0.0.1:8002/mcp \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            "${SESSION_HEADER[@]}" \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}')
          echo "== tools/list response body =="; echo "$TOOLS" | head -5

          # One tool per enabled app: absent means --enable-app dropped an app
          # this endpoint is for.
          for TOOL in nc_webdav_list_directory nc_notes_search_notes deck_get_boards; do
            echo "$TOOLS" | grep -q "\"$TOOL\"" \
              || { echo "FAILED: $TOOL missing — an enabled app did not register"; exit 1; }
          done

          # One tool per app that must stay off. Present means the flag was
          # dropped entirely and all twelve apps came back.
          for TOOL in nc_calendar_list_calendars nc_contacts_list_addressbooks nc_tables_list_tables; do
            if echo "$TOOLS" | grep -q "\"$TOOL\""; then
              echo "FAILED: $TOOL is registered — app selection is not in effect"
              exit 1
            fi
          done
          echo "nextcloud-mcp-basic tool surface OK"

      - name: Build plex-mcp image from pinned upstream ref
        run: |
          # Build the same Dockerfile build-plex-mcp-image.yaml pushes to GHCR
          # and side-load it, so this test never waits on a GHCR push — and
          # take the ref from the manifest, so it never tests a tag the
          # manifest doesn't run.
          IMAGE=$(python3 - <<'PY'
          import yaml
          for doc in yaml.safe_load_all(open("cluster/services/plex-mcp.yaml")):
              if doc and doc["kind"] == "Deployment":
                  print(doc["spec"]["template"]["spec"]["containers"][0]["image"])
          PY
          )
          echo "building $IMAGE"
          docker build -t "$IMAGE" \
            "https://github.com/niavasha/plex-mcp-server.git#${IMAGE##*:}"
          k3d image import "$IMAGE" -c ci

      - name: Deploy plex-mcp (real smoke test)
        run: |
          # PLEX_TOKEN is required: createServer() throws without it, once per
          # session, so an absent token fails every initialize while /health
          # still answers ok. The Arr keys only have to exist — tools/list
          # serves static schemas and contacts neither service.
          kubectl create secret generic plex-mcp-credentials \
            --from-literal=plex-token=ci-test-token \
            --from-literal=sonarr-api-key=ci-test-sonarr-key \
            --from-literal=radarr-api-key=ci-test-radarr-key \
            -n default
          kubectl apply -f cluster/services/plex-mcp.yaml
          kubectl -n default rollout status deployment/plex-mcp --timeout=180s

      - name: Diagnose plex-mcp failure
        if: failure()
        run: |
          kubectl -n default describe pod -l run=plex-mcp
          echo "=== logs ==="
          kubectl -n default logs -l run=plex-mcp --tail=200 || true
          echo "=== events ==="
          kubectl -n default get events --sort-by=.lastTimestamp | tail -40

      - name: Verify plex-mcp upstream wiring
        run: |
          # tools/list cannot catch this: the Arr tools come from static
          # schemas and register whether or not the URLs point anywhere. A
          # dropped or wrong URL only surfaces on a real tool call, against
          # services CI does not have.
          ENV_PATH=.spec.template.spec.containers[0].env
          for PAIR in "PLEX_URL=http://plex.default.svc.cluster.local:32400" \
                      "SONARR_URL=http://sonarr.default.svc.cluster.local:8989" \
                      "RADARR_URL=http://radarr.default.svc.cluster.local:7878"; do
            GOT=$(kubectl -n default get deploy plex-mcp -o \
              jsonpath="{$ENV_PATH[?(@.name=='${PAIR%%=*}')].value}")
            echo "${PAIR%%=*}: $GOT"
            [ "$GOT" = "${PAIR#*=}" ] || { echo "FAILED: expected ${PAIR#*=}"; exit 1; }
          done
          # Every credential comes from the Secret, never a literal.
          for NAME in PLEX_TOKEN SONARR_API_KEY RADARR_API_KEY; do
            GOT=$(kubectl -n default get deploy plex-mcp -o \
              jsonpath="{$ENV_PATH[?(@.name=='$NAME')].valueFrom.secretKeyRef.name}")
            echo "$NAME: from secret '$GOT'"
            [ -n "$GOT" ] || { echo "FAILED: $NAME is not sourced from a Secret"; exit 1; }
          done

      - name: Verify plex-mcp health and Arr tool surface
        run: |
          # 8003: 8000-8002 belong to the two nextcloud-mcp forwards above.
          kubectl -n default port-forward svc/plex-mcp 8003:3000 &
          PF_PID=$!
          trap 'kill $PF_PID' EXIT
          for i in $(seq 1 10); do
            curl -fsS http://127.0.0.1:8003/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8003/health
          echo

          INIT_PAYLOAD='{"jsonrpc":"2.0","id":1,"method":"initialize",'
          INIT_PAYLOAD+='"params":{"protocolVersion":"2025-06-18","capabilities":{},'
          INIT_PAYLOAD+='"clientInfo":{"name":"test-cluster-ci","version":"0.0.0"}}}'

          INIT_HEADERS=$(mktemp)
          curl -sS -D "$INIT_HEADERS" -X POST http://127.0.0.1:8003/mcp \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d "$INIT_PAYLOAD" >/dev/null

          # Streamable HTTP assigns a session that later requests must echo.
          SESSION_ID=$(grep -i '^Mcp-Session-Id:' "$INIT_HEADERS" | tr -d '\r' | cut -d' ' -f2-)
          SESSION_HEADER=()
          [ -n "$SESSION_ID" ] && SESSION_HEADER=(-H "Mcp-Session-Id: $SESSION_ID")

          curl -sS -X POST http://127.0.0.1:8003/mcp \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            "${SESSION_HEADER[@]}" \
            -d '{"jsonrpc":"2.0","method":"notifications/initialized","params":{}}' >/dev/null

          TOOLS=$(curl -sS -X POST http://127.0.0.1:8003/mcp \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            "${SESSION_HEADER[@]}" \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}')
          echo "== tools/list response body =="; echo "$TOOLS" | head -5

          # Radarr and Sonarr are the point of this workload, not a bonus. One
          # read, one write and the search trigger per service: an image built
          # before the Arr merge, or a future upstream that gates these on
          # reachable services, still boots and still passes /health.
          for TOOL in sonarr_get_series sonarr_add_series sonarr_trigger_search \
                      radarr_get_movies radarr_add_movie radarr_trigger_search \
                      get_libraries; do
            echo "$TOOLS" | grep -q "\"$TOOL\"" \
              || { echo "FAILED: $TOOL missing from tools/list"; exit 1; }
          done
          echo "plex-mcp health and tool surface OK"

      - name: Server-side dry-run — all manifests
        run: |
          FAILED=0
          while IFS= read -r f; do
            echo "==> $f"
            kubectl apply --dry-run=server -f "$f" || { echo "FAILED: $f"; FAILED=1; }
          done < <(find cluster -name "*.yaml" \
            ! -path "*/ansible/*" \
            ! -path "*/helm/*" \
            ! -path "*/localdev/*" \
            ! -path "*/argocd/*" \
            ! -path "*/operators/*" \
            ! -path "*/priorityClasses/*" \
            ! -name "cert-manager.yaml" \
            ! -name "l2-config.yaml" \
            ! -name "traefik-default-tls.yaml" \
            ! -name "elasticsearch.yaml" \
            ! -name "probe-alerts.yaml" \
            | sort)
          exit "$FAILED"

      - name: Assert delugevpn WireGuard transport/privilege coupling
        run: |
          python3 - <<'PY'
          import sys, yaml
          f = "cluster/services/delugevpn.yaml"
          dep = next((d for d in yaml.safe_load_all(open(f))
                      if d and d.get("kind") == "Deployment"
                      and d["metadata"]["name"] == "delugevpn"), None)
          containers = (((dep or {}).get("spec", {}).get("template", {})
                         .get("spec", {}).get("containers")) or [])
          c = next((c for c in containers if c["name"] == "delugevpn"), None)
          if c is None:
              print(f"BAD {f}: no 'delugevpn' container in a Deployment named 'delugevpn'")
              sys.exit(1)
          env = {e["name"]: e.get("value") for e in c.get("env", [])}
          sc = c.get("securityContext") or {}
          failed = 0
          # binhex's WireGuard client needs a rw /proc/sys so wg-quick can set
          # net.ipv4.conf.all.src_valid_mark; dropping privileged kills the tunnel
          # silently (the workload fails closed), so the two must move together.
          if env.get("VPN_CLIENT") != "wireguard":
              print(f"BAD {f}: VPN_CLIENT is {env.get('VPN_CLIENT')!r}, expected 'wireguard'")
              failed = 1
          if sc.get("privileged") is not True:
              print(f"BAD {f}: securityContext.privileged must be true for VPN_CLIENT=wireguard")
              failed = 1
          if "capabilities" in sc:
              print(f"BAD {f}: privileged supersedes capabilities; drop the capabilities block")
              failed = 1
          if not failed:
              print(f"OK  {f}: VPN_CLIENT=wireguard with privileged: true")
          sys.exit(failed)
          PY

      - name: Validate embedded Grafana dashboard JSON
        run: |
          python3 - <<'PY'
          import glob, json, sys, yaml
          failed = 0
          for f in sorted(glob.glob("cluster/services/grafana-*.yaml")):
              cm = yaml.safe_load(open(f))
              for key, val in (cm.get("data") or {}).items():
                  if not key.endswith(".json"):
                      continue
                  try:
                      json.loads(val)
                      print(f"OK  {f}:{key}")
                  except json.JSONDecodeError as e:
                      print(f"BAD {f}:{key} — {e}")
                      failed = 1
          sys.exit(failed)
          PY

  helm-dry-run:
    name: Helm dry-run
    runs-on: ubuntu-latest
    env:
      K3D_VERSION: v5.7.5
      AM_VERSION: "0.27.0"

    steps:
      - uses: actions/checkout@v4

      - name: Cache k3d binary
        id: cache-k3d
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/k3d
          key: k3d-${{ env.K3D_VERSION }}

      - name: Install k3d
        if: steps.cache-k3d.outputs.cache-hit != 'true'
        run: |
          curl -fsSLo /tmp/k3d \
            "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/k3d-linux-amd64"
          install -m 755 /tmp/k3d /usr/local/bin/k3d

      - name: Create k3d cluster
        run: k3d cluster create ci --wait --no-lb

      - name: Add helm repos
        run: |
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo add nfs-subdir-external-provisioner \
            https://kubernetes-sigs.github.io/nfs-subdir-external-provisioner/
          helm repo add node-feature-discovery \
            https://kubernetes-sigs.github.io/node-feature-discovery/charts
          helm repo add nextcloud-mcp https://cbcoutinho.github.io/helm-charts
          helm repo add jetstack https://charts.jetstack.io
          helm repo update

      - name: Dry-run argocd
        run: |
          helm template argocd argo/argo-cd \
            --namespace argocd \
            -f cluster/helm/argocd/values.yaml > /dev/null

      - name: Dry-run kube-prometheus-stack
        run: |
          helm template kube-prometheus-stack \
            oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack \
            --namespace monitoring \
            -f cluster/helm/kube-prometheus-stack/values.yaml > /dev/null

      - name: Cache amtool binary
        id: cache-amtool
        uses: actions/cache@v4
        with:
          path: alertmanager-${{ env.AM_VERSION }}.linux-amd64
          key: amtool-${{ env.AM_VERSION }}

      - name: Download amtool
        if: steps.cache-amtool.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://github.com/prometheus/alertmanager/releases/download/v${AM_VERSION}/alertmanager-${AM_VERSION}.linux-amd64.tar.gz" \
            | tar xz

      - name: Validate Alertmanager config (amtool)
        run: |
          # Extract the alertmanager.config block we maintain and lint it
          # (catches Go-template typos in the Grafana deep link, group_by, etc.)
          python3 - <<'PY'
          import yaml
          v = yaml.safe_load(open("cluster/helm/kube-prometheus-stack/values.yaml"))
          open("/tmp/am.yaml", "w").write(yaml.safe_dump(v["alertmanager"]["config"]))
          PY
          "./alertmanager-${AM_VERSION}.linux-amd64/amtool" check-config /tmp/am.yaml

      - name: Dry-run alloy
        run: |
          helm upgrade --install alloy grafana/alloy \
            --namespace monitoring --create-namespace \
            --dry-run \
            -f cluster/helm/alloy/values.yaml

      - name: Dry-run kubernetes-event-exporter
        run: |
          helm template kubernetes-event-exporter \
            oci://ghcr.io/ownkube/charts/kubernetes-events-exporter --version 0.1.2 \
            --namespace monitoring \
            -f cluster/helm/kubernetes-event-exporter/values.yaml > /dev/null

      - name: Dry-run nfs-subdir-external-provisioner
        run: |
          helm upgrade --install nfs-subdir-external-provisioner \
            nfs-subdir-external-provisioner/nfs-subdir-external-provisioner \
            --namespace kube-system \
            --dry-run \
            --set nfs.server=shoebox.vert \
            --set nfs.path=/export/storage/configs/kubernetes

      - name: Dry-run node-feature-discovery
        run: |
          helm upgrade --install node-feature-discovery \
            node-feature-discovery/node-feature-discovery \
            --namespace node-feature-discovery --create-namespace \
            --dry-run \
            -f cluster/helm/node-feature-discovery/values.yaml

      - name: Dry-run kubernetes-mcp-server
        run: |
          helm template kubernetes-mcp-server \
            oci://ghcr.io/containers/charts/kubernetes-mcp-server --version 0.1.0 \
            --namespace default \
            -f cluster/helm/kubernetes-mcp-server/values.yaml > /dev/null

      - name: Dry-run nextcloud-mcp-server
        run: |
          helm template nextcloud-mcp \
            nextcloud-mcp/nextcloud-mcp-server --version 0.102.7 \
            --namespace default \
            -f cluster/helm/nextcloud-mcp-server/values.yaml > /dev/null

      - name: Dry-run nextcloud-mcp-basic
        run: |
          helm template nextcloud-mcp-basic \
            nextcloud-mcp/nextcloud-mcp-server --version 0.102.7 \
            --namespace default \
            -f cluster/helm/nextcloud-mcp-basic/values.yaml > /dev/null

      - name: Resolve pinned cert-manager chart version
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import yaml
          app = yaml.safe_load(open("cluster/argocd/apps/cert-manager.yaml"))
          ver = next(s["targetRevision"] for s in app["spec"]["sources"]
                     if s.get("chart") == "cert-manager")
          print(f"CM_VERSION={ver}")
          PY

      - name: Dry-run cert-manager
        run: |
          helm template cert-manager \
            jetstack/cert-manager --version "${CM_VERSION}" \
            --namespace cert-manager \
            -f cluster/helm/cert-manager/values.yaml > /dev/null
