          exit "$FAILED"

      - name: Assert whole-/config apps keep /config on Longhorn
        run: |
          python3 - <<'PY'
          import sys, yaml
          # Apps whose entire /config lives on a Longhorn volumeClaimTemplate —
          # the ombi shape. SQLite in WAL mode does not work over NFS (#241), so
          # each app joins this set in the PR that converts it. radarr/sonarr are
          # deliberately absent: they overlay only /db and keep /config on NFS.
          CONFIG_ON_LONGHORN = {"ombi", "jackett", "nzbget", "delugevpn", "tautulli",
                                "starloom"}
          failed = 0
          for app in sorted(CONFIG_ON_LONGHORN):
              bad = 0
              f = f"cluster/services/{app}.yaml"
              docs = [d for d in yaml.safe_load_all(open(f)) if isinstance(d, dict)]
              sts = next((d for d in docs if d.get("kind") == "StatefulSet"
                          and d["metadata"]["name"] == app), None)
              if sts is None:
                  print(f"BAD {f}: no StatefulSet named {app!r} "
                        "(a volumeClaimTemplate needs a StatefulSet)")
                  failed = 1
                  continue
              spec = sts["spec"]
              pod = spec["template"]["spec"]
              vcts = {v["metadata"]["name"]: v for v in spec.get("volumeClaimTemplates") or []}
              # claimName by pod-volume name, to tell a volumeClaimTemplate mount
              # apart from one backed by a plain PVC such as app-configs.
              pod_claims = {v["name"]: (v.get("persistentVolumeClaim") or {}).get("claimName")
                            for v in pod.get("volumes") or []}
              mounts = [m for c in pod.get("containers") or []
                        for m in c.get("volumeMounts") or []
                        if m["mountPath"].rstrip("/") == "/config"]

              if spec.get("serviceName") != app:
                  print(f"BAD {f}: serviceName is {spec.get('serviceName')!r}, expected {app!r}")
                  failed = bad = 1
              if len(mounts) != 1:
                  print(f"BAD {f}: expected exactly one /config mount, found {len(mounts)}")
                  failed = 1
                  continue
              mount = mounts[0]
              if mount["name"] in pod_claims:
                  print(f"BAD {f}: /config resolves to PVC "
                        f"{pod_claims[mount['name']]!r}, not a volumeClaimTemplate")
                  failed = 1
                  continue
              if mount["name"] not in vcts:
                  print(f"BAD {f}: /config mounts {mount['name']!r}, "
                        "which is neither a pod volume nor a volumeClaimTemplate")
                  failed = 1
                  continue
              # A subPath would split the database from its WAL across volumes,
              # which is exactly what makes the snapshot non-atomic.
              if "subPath" in mount:
                  print(f"BAD {f}: /config mount declares subPath {mount['subPath']!r}; "
                        "the whole /config moves")
                  failed = bad = 1
              sc = vcts[mount["name"]]["spec"].get("storageClassName")
              if sc != "longhorn":
                  print(f"BAD {f}: {mount['name']} storageClassName is {sc!r}, expected 'longhorn'")
                  failed = bad = 1
              if not bad:
                  print(f"OK  {f}: /config on longhorn volumeClaimTemplate {mount['name']}")
          sys.exit(failed)
          PY

      - name: Assert stateless apps declare no volumes
        run: |
          python3 - <<'PY'
          import sys, yaml
          # Apps with no durable state, which under the storage placement rule
          # in cluster/services/README.md get no volume at all. A vestigial
          # mount is not free: it makes the pod fail to start whenever its
          # backing storage is away, for nothing in return.
          NO_VOLUMES = {"redis"}
          WORKLOADS = {"Deployment", "StatefulSet", "DaemonSet"}
          failed = 0
          for app in sorted(NO_VOLUMES):
              f = f"cluster/services/{app}.yaml"
              docs = [d for d in yaml.safe_load_all(open(f)) if isinstance(d, dict)]
              w = next((d for d in docs if d.get("kind") in WORKLOADS
                        and d["metadata"]["name"] == app), None)
              if w is None:
                  print(f"BAD {f}: no workload named {app!r}")
                  failed = 1
                  continue
              spec = w["spec"]
              pod = spec["template"]["spec"]
              bad = 0
              for v in pod.get("volumes") or []:
                  print(f"BAD {f}: declares pod volume {v['name']!r}")
                  failed = bad = 1
              for v in spec.get("volumeClaimTemplates") or []:
                  print(f"BAD {f}: declares volumeClaimTemplate {v['metadata']['name']!r}")
                  failed = bad = 1
              for c in (pod.get("containers") or []) + (pod.get("initContainers") or []):
                  for m in c.get("volumeMounts") or []:
                      print(f"BAD {f}: container {c['name']!r} mounts "
                            f"{m['name']!r} at {m['mountPath']!r}")
                      failed = bad = 1
              if not bad:
                  print(f"OK  {f}: {w['kind']} {app} declares no volumes")
      - name: Assert calibre and calibre-web share one Longhorn volume
        run: |
          python3 - <<'PY'
          import sys, yaml
          # calibre and calibre-web were two StatefulSets both mounting
          # subPath: calibre from the app-configs NFS PVC, so two pods read and
          # wrote one SQLite library over NFS (#254). They are now one pod with
          # two containers on one Longhorn volume. This is a third storage shape,
          # distinct from the whole-/config apps above: subPaths are used here to
          # keep two containers' configs apart, but they stay inside a single
          # volume, so a snapshot is still atomic over the library and its WAL.
          f = "cluster/services/calibre.yaml"
          docs = [d for d in yaml.safe_load_all(open(f)) if isinstance(d, dict)]
          sts = [d for d in docs if d.get("kind") == "StatefulSet"]
          failed = 0

          if len(sts) != 1 or sts[0]["metadata"]["name"] != "calibre":
              names = [d["metadata"]["name"] for d in sts]
              print(f"BAD {f}: expected exactly one StatefulSet named 'calibre', found {names}")
              sys.exit(1)

          spec = sts[0]["spec"]
          pod = spec["template"]["spec"]
          vcts = {v["metadata"]["name"]: v for v in spec.get("volumeClaimTemplates") or []}
          if len(vcts) != 1:
              print(f"BAD {f}: expected exactly one volumeClaimTemplate, found {list(vcts)}")
              sys.exit(1)
          vct_name, vct = next(iter(vcts.items()))

          sc = vct["spec"].get("storageClassName")
          if sc != "longhorn":
              print(f"BAD {f}: {vct_name} storageClassName is {sc!r}, expected 'longhorn'")
              failed = 1

          # The hazard being removed: any remaining app-configs mount would put
          # the library back on NFS.
          for v in pod.get("volumes") or []:
              if (v.get("persistentVolumeClaim") or {}).get("claimName") == "app-configs":
                  print(f"BAD {f}: pod volume {v['name']!r} still claims app-configs")
                  failed = 1

          containers = {c["name"]: c for c in pod.get("containers") or []}
          for want in ("calibre", "calibre-web"):
              if want not in containers:
                  print(f"BAD {f}: no {want!r} container in the merged pod")
                  sys.exit(1)

          def mount(container, path):
              for m in containers[container].get("volumeMounts") or []:
                  if m["mountPath"].rstrip("/") == path:
                      return m
              return None

          lib = mount("calibre", "/config")
          web_lib = mount("calibre-web", "/calibre-library")
          for label, m in (("calibre /config", lib), ("calibre-web /calibre-library", web_lib)):
              if m is None:
                  print(f"BAD {f}: {label} is not mounted")
                  sys.exit(1)
              if m["name"] != vct_name:
                  print(f"BAD {f}: {label} mounts {m['name']!r}, not the {vct_name!r} template")
                  failed = 1

          # The point of the collapse: calibre-web must read the very directory
          # calibre writes. Different subPaths would leave it on an empty library
          # with no error anywhere.
          if lib.get("subPath") != web_lib.get("subPath"):
              print(f"BAD {f}: calibre /config subPath {lib.get('subPath')!r} != "
                    f"calibre-web /calibre-library subPath {web_lib.get('subPath')!r}; "
                    "calibre-web would read a different directory")
              failed = 1

          env = {e["name"]: e.get("value") for e in containers["calibre-web"].get("env", [])}
          calibre_path = env.get("CALIBRE_PATH", "")
          if not calibre_path.startswith(web_lib["mountPath"].rstrip("/") + "/"):
              print(f"BAD {f}: CALIBRE_PATH {calibre_path!r} is not under "
                    f"{web_lib['mountPath']!r}")
              failed = 1

          # One pod now serves both hostnames, so both Services must select it.
          # A stale selector routes to nothing and only shows up as a 503.
          labels = spec["template"]["metadata"]["labels"]
          for svc in (d for d in docs if d.get("kind") == "Service"):
              sel = svc["spec"].get("selector") or {}
              if not all(labels.get(k) == v for k, v in sel.items()):
                  print(f"BAD {f}: Service {svc['metadata']['name']!r} selector {sel} "
                        f"does not match the merged pod labels {labels}")
                  failed = 1

          if not failed:
              print(f"OK  {f}: one pod, both containers on {vct_name} (longhorn), "
                    f"library shared at subPath {lib.get('subPath')!r}")
          sys.exit(failed)
          PY

      - name: Assert delugevpn WireGuard transport/privilege coupling
        run: |
          python3 - <<'PY'
          import sys, yaml
          f = "cluster/services/delugevpn.yaml"
          # StatefulSet since #241 moved /config onto a Longhorn
          # volumeClaimTemplate, which a Deployment cannot carry.
          sts = next((d for d in yaml.safe_load_all(open(f))
                      if d and d.get("kind") == "StatefulSet"
                      and d["metadata"]["name"] == "delugevpn"), None)
          containers = (((sts or {}).get("spec", {}).get("template", {})
                         .get("spec", {}).get("containers")) or [])
          c = next((c for c in containers if c["name"] == "delugevpn"), None)
          if c is None:
              print(f"BAD {f}: no 'delugevpn' container in a StatefulSet named 'delugevpn'")
              sys.exit(1)
          env = {e["name"]: e.get("value") for e in c.get("env", [])}
          sc = c.get("securityContext") or {}
          failed = 0
          # binhex's WireGuard client needs a rw /proc/sys so wg-quick can set
          # net.ipv4.conf.all.src_valid_mark; dropping privileged kills the tunnel
          # silently (the workload fails closed), so the two must move together.
          if env.get("VPN_CLIENT") != "wireguard":
              print(f"BAD {f}: VPN_CLIENT is {env.get('VPN_CLIENT')!r}, expected 'wireguard'")
              failed = 1
          if sc.get("privileged") is not True:
              print(f"BAD {f}: securityContext.privileged must be true for VPN_CLIENT=wireguard")
              failed = 1
          if "capabilities" in sc:
              print(f"BAD {f}: privileged supersedes capabilities; drop the capabilities block")
              failed = 1
          if not failed:
              print(f"OK  {f}: VPN_CLIENT=wireguard with privileged: true")
          sys.exit(failed)
          PY

      - name: Validate embedded Grafana dashboard JSON
        run: |
          python3 - <<'PY'
          import glob, json, sys, yaml
          failed = 0
          for f in sorted(glob.glob("cluster/services/grafana-*.yaml")):
              cm = yaml.safe_load(open(f))
              for key, val in (cm.get("data") or {}).items():
                  if not key.endswith(".json"):
                      continue
                  try:
                      json.loads(val)
                      print(f"OK  {f}:{key}")
                  except json.JSONDecodeError as e:
                      print(f"BAD {f}:{key} — {e}")
                      failed = 1
          sys.exit(failed)
          PY

  helm-dry-run:
    name: Helm dry-run
    runs-on: ubuntu-latest
    env:
      K3D_VERSION: v5.7.5
      AM_VERSION: "0.27.0"

    steps:
      - uses: actions/checkout@v4

      - name: Cache k3d binary
        id: cache-k3d
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/k3d
          key: k3d-${{ env.K3D_VERSION }}

      - name: Install k3d
        if: steps.cache-k3d.outputs.cache-hit != 'true'
        run: |
          curl -fsSLo /tmp/k3d \
            "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/k3d-linux-amd64"
          install -m 755 /tmp/k3d /usr/local/bin/k3d

      - name: Create k3d cluster
        run: k3d cluster create ci --wait --no-lb

      - name: Add helm repos
        run: |
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo add nfs-subdir-external-provisioner \
            https://kubernetes-sigs.github.io/nfs-subdir-external-provisioner/
          helm repo add node-feature-discovery \
            https://kubernetes-sigs.github.io/node-feature-discovery/charts
          helm repo add nextcloud-mcp https://cbcoutinho.github.io/helm-charts
          helm repo add jetstack https://charts.jetstack.io
          helm repo add longhorn https://charts.longhorn.io
          helm repo update

      - name: Dry-run argocd
        run: |
          helm template argocd argo/argo-cd \
            --namespace argocd \
            -f cluster/helm/argocd/values.yaml > /dev/null

      - name: Resolve the kube-prometheus-stack chart pin
        id: kps-chart
        run: |
          version=$(python3 -c '
          import yaml
          sources = yaml.safe_load(
              open("cluster/argocd/apps/kube-prometheus-stack.yaml"))["spec"]["sources"]
          print(next(s["targetRevision"]
                     for s in sources if s.get("chart") == "kube-prometheus-stack"))
          ')
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Dry-run kube-prometheus-stack
        # Rendered to a file, not /dev/null: the next step reads it. Pinned to
        # what ArgoCD deploys, so an assertion here says something about the
        # cluster rather than about the chart's latest release.
        run: |
          helm template kube-prometheus-stack \
            oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack \
            --version "${{ steps.kps-chart.outputs.version }}" \
            --namespace monitoring \
            -f cluster/helm/kube-prometheus-stack/values.yaml \
            > /tmp/kube-prometheus-stack.yaml

      - name: Assert the monitoring stack's I/O settings reach the chart
        run: |
          python3 .github/scripts/check_monitoring_io_settings.py \
            --overrides cluster/helm/kube-prometheus-stack/values.yaml \
            --rendered /tmp/kube-prometheus-stack.yaml

      - name: Cache amtool binary
        id: cache-amtool
        uses: actions/cache@v4
        with:
          path: alertmanager-${{ env.AM_VERSION }}.linux-amd64
          key: amtool-${{ env.AM_VERSION }}

      - name: Download amtool
        if: steps.cache-amtool.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://github.com/prometheus/alertmanager/releases/download/v${AM_VERSION}/alertmanager-${AM_VERSION}.linux-amd64.tar.gz" \
            | tar xz

      - name: Validate Alertmanager config (amtool)
        run: |
          # Extract the alertmanager.config block we maintain and lint it
          # (catches Go-template typos in the Grafana deep link, group_by, etc.)
          python3 - <<'PY'
          import yaml
          v = yaml.safe_load(open("cluster/helm/kube-prometheus-stack/values.yaml"))
          open("/tmp/am.yaml", "w").write(yaml.safe_dump(v["alertmanager"]["config"]))
          PY
          "./alertmanager-${AM_VERSION}.linux-amd64/amtool" check-config /tmp/am.yaml

      - name: Resolve the loki chart pin
        id: loki-chart
        run: |
          version=$(python3 -c '
          import yaml
          sources = yaml.safe_load(
              open("cluster/argocd/apps/loki.yaml"))["spec"]["sources"]
          print(next(s["targetRevision"]
                     for s in sources if s.get("chart") == "loki"))
          ')
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Dry-run loki
        run: |
          helm upgrade --install loki \
            oci://ghcr.io/grafana-community/helm-charts/loki \
            --version "${{ steps.loki-chart.outputs.version }}" \
            --namespace loki --create-namespace \
            --dry-run \
            -f cluster/helm/loki/values.yaml

      - name: Assert loki values keys reach the chart
        # `loki:` is Loki's own config, not chart structure.
        run: |
          helm show values \
            oci://ghcr.io/grafana-community/helm-charts/loki \
            --version "${{ steps.loki-chart.outputs.version }}" \
            > /tmp/loki-chart-values.yaml
          python3 .github/scripts/check_helm_values_keys.py \
            --chart-values /tmp/loki-chart-values.yaml \
            --overrides cluster/helm/loki/values.yaml \
            --passthrough loki

      - name: Resolve the alloy chart pin
        id: alloy-chart
        run: |
          version=$(python3 -c '
          import yaml
          sources = yaml.safe_load(
              open("cluster/argocd/apps/alloy.yaml"))["spec"]["sources"]
          print(next(s["targetRevision"]
                     for s in sources if s.get("chart") == "alloy"))
          ')
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Dry-run alloy
        # Rendered to a file, not /dev/null: the next step reads it. Pinned to
        # what ArgoCD deploys, so an assertion here says something about the
        # cluster rather than about the chart's latest release.
        run: |
          helm template alloy grafana/alloy \
            --version "${{ steps.alloy-chart.outputs.version }}" \
            --namespace monitoring \
            -f cluster/helm/alloy/values.yaml \
            > /tmp/alloy.yaml

      - name: Assert alloy tails pod logs from disk, not the apiserver
        run: |
          python3 .github/scripts/check_alloy_log_tailing.py \
            --rendered /tmp/alloy.yaml

      - name: Dry-run kubernetes-event-exporter
        run: |
          helm template kubernetes-event-exporter \
            oci://ghcr.io/ownkube/charts/kubernetes-events-exporter --version 0.1.2 \
            --namespace monitoring \
            -f cluster/helm/kubernetes-event-exporter/values.yaml > /dev/null

      - name: Dry-run nfs-subdir-external-provisioner
        run: |
          helm upgrade --install nfs-subdir-external-provisioner \
            nfs-subdir-external-provisioner/nfs-subdir-external-provisioner \
            --namespace kube-system \
            --dry-run \
            --set nfs.server=shoebox.vert \
            --set nfs.path=/export/storage/configs/kubernetes

      - name: Dry-run node-feature-discovery
        run: |
          helm upgrade --install node-feature-discovery \
            node-feature-discovery/node-feature-discovery \
            --namespace node-feature-discovery --create-namespace \
            --dry-run \
            -f cluster/helm/node-feature-discovery/values.yaml

      - name: Dry-run kubernetes-mcp-server
        run: |
          helm template kubernetes-mcp-server \
            oci://ghcr.io/containers/charts/kubernetes-mcp-server --version 0.1.0 \
            --namespace default \
            -f cluster/helm/kubernetes-mcp-server/values.yaml > /dev/null

      - name: Dry-run nextcloud-mcp-server
        run: |
          helm template nextcloud-mcp \
            nextcloud-mcp/nextcloud-mcp-server --version 0.102.7 \
            --namespace default \
            -f cluster/helm/nextcloud-mcp-server/values.yaml > /dev/null

      - name: Dry-run nextcloud-mcp-basic
        run: |
          helm template nextcloud-mcp-basic \
            nextcloud-mcp/nextcloud-mcp-server --version 0.102.7 \
            --namespace default \
            -f cluster/helm/nextcloud-mcp-basic/values.yaml > /dev/null

      - name: Resolve pinned Longhorn chart version
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import yaml
          app = yaml.safe_load(open("cluster/argocd/apps/longhorn.yaml"))
          ver = next(s["targetRevision"] for s in app["spec"]["sources"]
                     if s.get("chart") == "longhorn")
          print(f"LONGHORN_VERSION={ver}")
          PY

      - name: Dry-run longhorn and diff the render against live cluster state
        # Longhorn's StorageClass is not a chart object: the chart renders it
        # into a ConfigMap that longhorn-manager applies. `helm template` with
        # no cluster to read from falls back to a kubeVersion the chart
        # rejects, so pass the one the rest of CI validates against.
        run: |
          helm template longhorn longhorn/longhorn \
            --version "${LONGHORN_VERSION}" \
            --namespace longhorn-system \
            --kube-version 1.29.0 \
            -f cluster/helm/longhorn/values.yaml > /tmp/longhorn-render.yaml
          python3 .github/scripts/check_longhorn_render.py /tmp/longhorn-render.yaml

      - name: Resolve pinned cert-manager chart version
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import yaml
          app = yaml.safe_load(open("cluster/argocd/apps/cert-manager.yaml"))
          ver = next(s["targetRevision"] for s in app["spec"]["sources"]
                     if s.get("chart") == "cert-manager")
          print(f"CM_VERSION={ver}")
          PY

      - name: Dry-run cert-manager
        run: |
          helm template cert-manager \
            jetstack/cert-manager --version "${CM_VERSION}" \
            --namespace cert-manager \
            -f cluster/helm/cert-manager/values.yaml > /dev/null
