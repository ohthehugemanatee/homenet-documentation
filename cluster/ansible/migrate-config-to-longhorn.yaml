---
# Move one app's /config off the app-configs NFS PVC onto its own Longhorn
# volume (#241 — SQLite in WAL mode does not work over NFS). See
# README.md for the operator workflow.
#
#   ansible-playbook migrate-config-to-longhorn.yaml -e app=jackett -t stage
#
# `stage` is everything that must happen before the manifest PR merges. The app
# never boots against an empty volume, which is what keeps jackett from minting
# a fresh API key and breaking sonarr and radarr.

- name: Migrate an app's /config from NFS onto Longhorn
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    k8s_kubeconfig: "{{ lookup('env', 'KUBECONFIG') or (lookup('env', 'HOME') + '/.kube/config') }}"
    migrate_namespace: default
    migrate_argocd_namespace: argocd
    migrate_source_claim: app-configs
    migrate_helper_image: busybox:1.36
    migrate_owner: "1000:1000"
    migrate_copy_timeout: 900
    migrate_rollout_timeout: 600
    migrate_manifest: "{{ playbook_dir }}/../services/{{ app | default('') }}.yaml"
    migrate_helper_pod: "{{ app | default('') }}-config-migrate"
    # group_vars/all.yaml is not loaded for the implicit localhost, so carry the
    # same default the rolling playbooks get from there.
    migrate_state_dir: "{{ state_dir | default('/var/lib/ansible-upgrade') }}"

  tasks:

    # ── Preflight — runs for every phase ────────────────────────────────────
    - name: Preflight
      tags: always
      block:

        - name: Assert an app name was given
          ansible.builtin.assert:
            that:
              - app is defined
              - app is match('^[a-z0-9][a-z0-9-]*$')
            fail_msg: "pass the app to migrate, e.g. -e app=jackett"

        - name: Read the app's service manifest
          ansible.builtin.slurp:
            src: "{{ migrate_manifest }}"
          register: migrate_manifest_raw

        - name: Parse the app's StatefulSet from the service manifest
          ansible.builtin.set_fact:
            migrate_sts: >-
              {{ (migrate_manifest_raw.content | b64decode | from_yaml_all | list)
                 | select('mapping')
                 | selectattr('kind', 'defined')
                 | selectattr('kind', 'equalto', 'StatefulSet')
                 | selectattr('metadata.name', 'equalto', app)
                 | list | first | default({}, true) }}

        - name: Derive the config volume claim template and its mount
          ansible.builtin.set_fact:
            migrate_pvc_template: >-
              {{ (migrate_sts.spec.volumeClaimTemplates | default([]) | first) | default({}, true) }}
            migrate_config_mounts: >-
              {{ migrate_sts.spec.template.spec.containers | default([])
                 | map(attribute='volumeMounts', default=[]) | flatten
                 | selectattr('mountPath', 'equalto', '/config') | list }}

        # Same invariants test-cluster.yaml asserts, so CI and this playbook
        # cannot disagree about what "migrated" means.
        - name: Assert the volume claim template is on Longhorn
          ansible.builtin.assert:
            that:
              - migrate_sts | length > 0
              - (migrate_sts.spec.volumeClaimTemplates | default([])) | length == 1
              - migrate_pvc_template.spec.storageClassName == 'longhorn'
              - migrate_config_mounts | length > 0
              - migrate_config_mounts
                | rejectattr('name', 'equalto', migrate_pvc_template.metadata.name)
                | list | length == 0
            fail_msg: >-
              {{ migrate_manifest }} needs a StatefulSet named {{ app }} with
              exactly one longhorn volumeClaimTemplate, and every /config mount
              on it. Run this from a checkout of the branch that converts it.

        # Only the whole-/config shape forbids a subPath, and the manifest says
        # which shape this is — a merged pod mounts /config once per container.
        # Those subPaths stay inside one volume, so a snapshot still covers the
        # database and its WAL together.
        - name: Assert the manifest is in the migrated shape
          when: migrate_config_mounts | length == 1
          ansible.builtin.assert:
            that:
              - migrate_config_mounts[0].subPath is not defined
            fail_msg: >-
              {{ migrate_manifest }} is not in the migrated shape: it needs a
              StatefulSet named {{ app }} with exactly one longhorn
              volumeClaimTemplate mounted at /config with no subPath. Run this
              from a checkout of the branch that converts it.

        # A StatefulSet adopts a pre-existing PVC named <template>-<sts>-<ordinal>
        # and silently provisions an empty one for any other name, so the name is
        # derived, never passed in.
        - name: Derive the PVC the StatefulSet will adopt
          ansible.builtin.set_fact:
            migrate_pvc_name: "{{ migrate_pvc_template.metadata.name }}-{{ app }}-0"

        - name: Assert the StatefulSet has a single replica
          ansible.builtin.assert:
            that:
              - (migrate_sts.spec.replicas | default(1) | int) == 1
            fail_msg: >-
              {{ app }} declares more than one replica, so ordinal 0 is not the
              only volume and staging a single PVC would leave the rest empty.

        - name: Show what will be migrated
          ansible.builtin.debug:
            msg: >-
              {{ app }}: {{ migrate_source_claim }}/{{ app }} (NFS) →
              PVC {{ migrate_pvc_name }}
              ({{ migrate_pvc_template.spec.resources.requests.storage }}, longhorn)

    # ── stage — everything before the manifest PR merges ────────────────────
    - name: Stage the migration
      tags: [never, stage]
      block:

        - name: Read the ArgoCD Application
          kubernetes.core.k8s_info:
            api_version: argoproj.io/v1alpha1
            kind: Application
            name: "{{ app }}"
            namespace: "{{ migrate_argocd_namespace }}"
            kubeconfig: "{{ k8s_kubeconfig }}"
          register: migrate_argocd_app
          changed_when: false

        - name: Assert the ArgoCD Application exists
          ansible.builtin.assert:
            that:
              - migrate_argocd_app.resources | length == 1
            fail_msg: "no ArgoCD Application {{ app }} in {{ migrate_argocd_namespace }}"

        - name: Look for the state directory
          ansible.builtin.stat:
            path: "{{ migrate_state_dir }}"
          register: migrate_state_dir_stat

        # Do not create it. On shoebox this is a host bind mount owned by the
        # `ansible` user and group-writable by Semaphore's uid, so Semaphore can
        # write files into it but cannot chmod the directory itself — and
        # `file: state=directory` with a mode enforces that chmod on every run
        # (#264).
        - name: Assert the state directory exists
          ansible.builtin.assert:
            that:
              - migrate_state_dir_stat.stat.exists
              - migrate_state_dir_stat.stat.isdir
              - migrate_state_dir_stat.stat.writeable
            fail_msg: >-
              {{ migrate_state_dir }} is not a writable directory. It is
              provisioned by shoebox/shoebox-ansible-setup.yaml; run that first,
              or pass -e state_dir=<path> for a local run.

        - name: Check for an already-saved sync policy
          ansible.builtin.stat:
            path: "{{ migrate_state_dir }}/migrate-{{ app }}-syncpolicy.json"
          register: migrate_saved_policy

        # Written before auto-sync is suspended, and never overwritten: a re-run
        # of stage must not save the suspended policy over the real one.
        - name: Save the ArgoCD sync policy for restore
          ansible.builtin.copy:
            content: "{{ migrate_argocd_app.resources[0].spec.syncPolicy | to_nice_json }}\n"
            dest: "{{ migrate_state_dir }}/migrate-{{ app }}-syncpolicy.json"
            mode: "0644"
          when: not migrate_saved_policy.stat.exists

        # selfHeal would scale the Deployment straight back up under us.
        - name: Suspend ArgoCD auto-sync
          kubernetes.core.k8s:
            state: patched
            api_version: argoproj.io/v1alpha1
            kind: Application
            name: "{{ app }}"
            namespace: "{{ migrate_argocd_namespace }}"
            definition:
              spec:
                syncPolicy:
                  automated: null
            kubeconfig: "{{ k8s_kubeconfig }}"

        - name: Look for the app's Deployment
          kubernetes.core.k8s_info:
            kind: Deployment
            name: "{{ app }}"
            namespace: "{{ migrate_namespace }}"
            kubeconfig: "{{ k8s_kubeconfig }}"
          register: migrate_deployment
          changed_when: false

        # Absent on a re-run after a partial stage, which must stay re-runnable.
        - name: Scale the Deployment to zero
          kubernetes.core.k8s_scale:
            kind: Deployment
            name: "{{ app }}"
            namespace: "{{ migrate_namespace }}"
            replicas: 0
            wait: true
            kubeconfig: "{{ k8s_kubeconfig }}"
          when: migrate_deployment.resources | length > 0

        - name: Create the Longhorn PVC the StatefulSet will adopt
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: v1
              kind: PersistentVolumeClaim
              metadata:
                name: "{{ migrate_pvc_name }}"
                namespace: "{{ migrate_namespace }}"
                labels:
                  homenet.vertesi.com/migrated-from: "{{ migrate_source_claim }}"
              spec: "{{ migrate_pvc_template.spec }}"
            kubeconfig: "{{ k8s_kubeconfig }}"

        - name: Copy the config into the Longhorn volume
          block:

            - name: Run the config copy helper pod
              kubernetes.core.k8s:
                state: present
                definition:
                  apiVersion: v1
                  kind: Pod
                  metadata:
                    name: "{{ migrate_helper_pod }}"
                    namespace: "{{ migrate_namespace }}"
                  spec:
                    restartPolicy: Never
                    volumes:
                      - name: src
                        persistentVolumeClaim:
                          claimName: "{{ migrate_source_claim }}"
                      - name: dst
                        persistentVolumeClaim:
                          claimName: "{{ migrate_pvc_name }}"
                    containers:
                      - name: copy
                        image: "{{ migrate_helper_image }}"
                        command:
                          - /bin/sh
                          - -c
                          - |
                            set -e
                            cp -a /src/. /dst/
                            chown -R {{ migrate_owner }} /dst
                            cd /src && find . -type f -exec sha256sum {} + | sort > /tmp/src.sums
                            cd /dst && find . -type f -exec sha256sum {} + | sort > /tmp/dst.sums
                            test -s /tmp/src.sums || {
                              echo "source is empty - wrong subPath?" >&2
                              exit 1
                            }
                            diff /tmp/src.sums /tmp/dst.sums
                            echo "copied $(wc -l < /tmp/dst.sums) files"
                        volumeMounts:
                          - name: src
                            mountPath: /src
                            subPath: "{{ app }}"
                            readOnly: true
                          - name: dst
                            mountPath: /dst
                        resources:
                          requests:
                            cpu: 100m
                            memory: 64Mi
                kubeconfig: "{{ k8s_kubeconfig }}"

            - name: Wait for the config copy helper pod to finish
              kubernetes.core.k8s_info:
                kind: Pod
                name: "{{ migrate_helper_pod }}"
                namespace: "{{ migrate_namespace }}"
                kubeconfig: "{{ k8s_kubeconfig }}"
              register: migrate_helper_status
              until: >-
                ((migrate_helper_status.resources | first | default({}, true)).status
                 | default({})).phase | default('') in ['Succeeded', 'Failed']
              retries: "{{ ((migrate_copy_timeout | int) / 10) | int }}"
              delay: 10
              changed_when: false

            - name: Read the config copy helper pod log
              kubernetes.core.k8s_log:
                kind: Pod
                name: "{{ migrate_helper_pod }}"
                namespace: "{{ migrate_namespace }}"
                kubeconfig: "{{ k8s_kubeconfig }}"
              register: migrate_helper_log
              changed_when: false

            # The pod's sha256sum diff over /src and /dst is the verification, and
            # it is symmetric: a truncated copy and leftovers from an earlier
            # partial run both fail it. Covers ServerConfig.json byte for byte.
            - name: Assert the config copy succeeded
              ansible.builtin.assert:
                that:
                  - ((migrate_helper_status.resources | first | default({}, true)).status
                     | default({})).phase | default('') == 'Succeeded'
                fail_msg: "{{ migrate_helper_pod }} did not succeed"

          rescue:

            - name: Fail with the config copy helper pod log
              ansible.builtin.fail:
                msg: >-
                  copying {{ app }}'s config onto {{ migrate_pvc_name }} failed.
                  Helper pod log:
                  {{ migrate_helper_log.log | default('(no log captured)') }}

          always:

            # It holds the RWO volume open, so a leftover pod blocks the retry.
            - name: Delete the config copy helper pod
              kubernetes.core.k8s:
                state: absent
                api_version: v1
                kind: Pod
                name: "{{ migrate_helper_pod }}"
                namespace: "{{ migrate_namespace }}"
                kubeconfig: "{{ k8s_kubeconfig }}"

        - name: Report the staged migration
          ansible.builtin.debug:
            msg:
              - "{{ app }} is staged on {{ migrate_pvc_name }} and scaled to 0."
              - "{{ migrate_helper_log.log | default('') | trim }}"
              - "Merge the manifest PR, then restore auto-sync:"
              - "  argocd app set {{ app }} --sync-policy automated --auto-prune --self-heal"
              - "The NFS directory is left untouched as the rollback path."

    # ── resume — after the manifest PR merges ───────────────────────────────
    - name: Resume after the merge
      tags: [never, resume]
      block:

        - name: Read the saved ArgoCD sync policy
          ansible.builtin.slurp:
            src: "{{ migrate_state_dir }}/migrate-{{ app }}-syncpolicy.json"
          register: migrate_saved_policy_raw

        # With auto-sync suspended, merging alone applies nothing. Restoring the
        # policy is what makes ArgoCD create the StatefulSet, which then adopts
        # the PVC staged earlier, and prune the old Deployment.
        - name: Restore ArgoCD auto-sync
          kubernetes.core.k8s:
            state: patched
            api_version: argoproj.io/v1alpha1
            kind: Application
            name: "{{ app }}"
            namespace: "{{ migrate_argocd_namespace }}"
            definition:
              spec:
                syncPolicy: "{{ migrate_saved_policy_raw.content | b64decode | from_json }}"
            kubeconfig: "{{ k8s_kubeconfig }}"

        - name: Wait for the StatefulSet to become ready
          kubernetes.core.k8s_info:
            kind: StatefulSet
            name: "{{ app }}"
            namespace: "{{ migrate_namespace }}"
            kubeconfig: "{{ k8s_kubeconfig }}"
          register: migrate_sts_status
          until: >-
            ((migrate_sts_status.resources | first | default({}, true)).status
             | default({})).readyReplicas | default(0) | int == 1
          retries: "{{ ((migrate_rollout_timeout | int) / 10) | int }}"
          delay: 10
          changed_when: false

        - name: Read the running pod
          kubernetes.core.k8s_info:
            kind: Pod
            name: "{{ app }}-0"
            namespace: "{{ migrate_namespace }}"
            kubeconfig: "{{ k8s_kubeconfig }}"
          register: migrate_running_pod
          changed_when: false

        - name: Resolve the running pod's /config mount
          ansible.builtin.set_fact:
            migrate_running_claims: >-
              {{ (migrate_running_pod.resources | first | default({}, true)).spec.volumes | default([])
                 | selectattr('persistentVolumeClaim', 'defined')
                 | items2dict(key_name='name', value_name='persistentVolumeClaim') }}
            migrate_running_mounts: >-
              {{ (migrate_running_pod.resources | first | default({}, true)).spec.containers | default([])
                 | map(attribute='volumeMounts', default=[]) | flatten
                 | selectattr('mountPath', 'equalto', '/config') | list }}

        # Every /config mount, not just the first: a pod can mount it once per
        # container, and all of them must be on the staged volume.
        - name: Resolve the claims backing /config
          ansible.builtin.set_fact:
            migrate_config_claims: >-
              {{ migrate_running_mounts
                 | map(attribute='name')
                 | map('extract', migrate_running_claims, 'claimName')
                 | select('string') | list | unique }}

        # The check that catches a mis-adopted PVC. The app is up either way, so
        # nothing else would notice — and for jackett, "up on the wrong volume"
        # means it has already minted an API key sonarr and radarr do not have.
        - name: Assert the pod's /config resolves to the staged Longhorn PVC
          ansible.builtin.assert:
            that:
              - migrate_running_mounts | length > 0
              - migrate_config_claims == [migrate_pvc_name]
            fail_msg: >-
              {{ app }}-0: /config resolves to PVC
              '{{ migrate_config_claims | join("', '") | default('(none)', true) }}',
              expected '{{ migrate_pvc_name }}'

        - name: Look for a leftover Deployment
          kubernetes.core.k8s_info:
            kind: Deployment
            name: "{{ app }}"
            namespace: "{{ migrate_namespace }}"
            kubeconfig: "{{ k8s_kubeconfig }}"
          register: migrate_old_deployment
          changed_when: false

        - name: Assert the old Deployment is gone
          ansible.builtin.assert:
            that:
              - migrate_old_deployment.resources | length == 0
            fail_msg: >-
              Deployment/{{ app }} still exists alongside the StatefulSet; ArgoCD
              has not pruned it, so the sync policy may not have been restored.

        - name: Report the completed migration
          ansible.builtin.debug:
            msg:
              - "{{ app }} is live on {{ migrate_pvc_name }}."
              - "The NFS directory is retained as the rollback path; do not delete it yet."

    # ── rollback — after the manifest PR is reverted ────────────────────────
    - name: Roll back to NFS
      tags: [never, rollback]
      block:

        - name: Read the saved ArgoCD sync policy for rollback
          ansible.builtin.slurp:
            src: "{{ migrate_state_dir }}/migrate-{{ app }}-syncpolicy.json"
          register: migrate_rollback_policy_raw

        - name: Restore ArgoCD auto-sync after rollback
          kubernetes.core.k8s:
            state: patched
            api_version: argoproj.io/v1alpha1
            kind: Application
            name: "{{ app }}"
            namespace: "{{ migrate_argocd_namespace }}"
            definition:
              spec:
                syncPolicy: "{{ migrate_rollback_policy_raw.content | b64decode | from_json }}"
            kubeconfig: "{{ k8s_kubeconfig }}"

        - name: Wait for the Deployment to become ready
          kubernetes.core.k8s_info:
            kind: Deployment
            name: "{{ app }}"
            namespace: "{{ migrate_namespace }}"
            kubeconfig: "{{ k8s_kubeconfig }}"
          register: migrate_rollback_deployment
          until: >-
            ((migrate_rollback_deployment.resources | first | default({}, true)).status
             | default({})).readyReplicas | default(0) | int == 1
          retries: "{{ ((migrate_rollout_timeout | int) / 10) | int }}"
          delay: 10
          changed_when: false

        # Deleting the staged volume is destructive and not reversible, so it is
        # printed rather than run.
        - name: Report the rollback
          ansible.builtin.debug:
            msg:
              - "{{ app }} is back on NFS."
              - "{{ migrate_pvc_name }} is retained. Delete it by hand once you are sure:"
              - "  kubectl -n {{ migrate_namespace }} delete pvc {{ migrate_pvc_name }}"
