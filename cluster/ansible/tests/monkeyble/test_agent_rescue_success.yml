---
# Scenario: upgrade health check fails, auto-rebuild succeeds.
# Expected: WARNING Pushover alert fires, failure flag cleared.
monkeyble_scenarios:
  agent_rescue_success:
    tasks_to_test: >-
      {{ monkeyble_scenarios.agent_rescue_success.pre_tasks
         + monkeyble_no_snapshot_ticket_tasks
         + monkeyble_shared_tasks
         + monkeyble_scenarios.agent_rescue_success.post_tasks }}
    pre_tasks:
      # ── Mock infrastructure tasks that require a real cluster ──────────────

      - task: "Verify k8s node name matches ansible_hostname"
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: false
              result_dict:
                resources:
                  - metadata:
                      name: testnode

      - task: "Cordon node before drain"
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: true
              result_dict:
                rc: 0

      # ── cordon_drain scale_down: single-replica Longhorn workload guard ──────
      # Crafted cluster state: StatefulSet default/nextcloud has a pod on this
      # node mounting PVC nextcloud-previews, backed by a numberOfReplicas=1
      # Longhorn StorageClass. The discovery Jinja must select it for scale-down.
      - task: "Find single-replica Longhorn StorageClasses"
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: false
              result_dict:
                resources:
                  - metadata:
                      name: longhorn-ephemeral-fast
                    provisioner: driver.longhorn.io
                    parameters:
                      numberOfReplicas: "1"

      - task: "Find PersistentVolumeClaims on single-replica Longhorn StorageClasses"
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: false
              result_dict:
                resources:
                  - metadata:
                      namespace: default
                      name: nextcloud-previews
                    spec:
                      storageClassName: longhorn-ephemeral-fast

      - task: "List pods scheduled on this node"
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: false
              result_dict:
                resources:
                  - metadata:
                      namespace: default
                      name: nextcloud-0
                      ownerReferences:
                        - kind: StatefulSet
                          name: nextcloud
                    spec:
                      nodeName: testnode
                      volumes:
                        - persistentVolumeClaim:
                            claimName: nextcloud-previews

      - task: "Get StatefulSets"
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: false
              result_dict:
                resources:
                  - metadata:
                      namespace: default
                      name: nextcloud
                    spec:
                      replicas: 1

      # No ownerReferences on this StatefulSet, so the target resolves to itself.
      - task: "Read the pre-drain replica count from that object"
        should_be_skipped: false
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: false
              result_dict:
                resources:
                  - spec:
                      replicas: 1

      - task: "Record pre-drain replica count on StatefulSet"
        extra_vars:
          item:
            namespace: default
            name: nextcloud
          cordon_drain_target_obj:
            resources:
              - spec:
                  replicas: 1
          cordon_drain_node_name: testnode
          cordon_drain_replicas_annotation: homenet.vertesi.com/pre-drain-replicas
          cordon_drain_node_annotation: homenet.vertesi.com/pre-drain-node
          k8s_kubeconfig: /tmp/monkeyble-kubeconfig
        test_input:
          - assert_dict_equal:
              arg_name: definition
              expected:
                metadata:
                  annotations:
                    homenet.vertesi.com/pre-drain-replicas: "1"
                    homenet.vertesi.com/pre-drain-node: testnode
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: true
              result_dict:
                rc: 0

      # Assert discovery actually selected the workload (loop not empty).
      - task: "Scale StatefulSet to zero"
        should_be_skipped: false
        extra_vars:
          item:
            namespace: default
            name: nextcloud
          cordon_drain_target:
            api_version: apps/v1
            kind: StatefulSet
            name: nextcloud
          k8s_kubeconfig: /tmp/monkeyble-kubeconfig
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: true
              result_dict:
                rc: 0

      - task: "Wait for the StatefulSet's pods to terminate"
        should_be_skipped: false
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: false
              result_dict:
                resources:
                  - status:
                      replicas: 0

      - task: "Drain node"
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: true
              result_dict:
                rc: 0

    post_tasks:
      # ── k3s_health role ───────────────────────────────────────────────────

      - task: "Wait for k3s-agent to become active"
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: false
              result_dict:
                stdout: "active"
                rc: 0

      - task: "Uncordon node"
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: true
              result_dict:
                rc: 0

      - task: "Verify node is Ready"
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: false
              result_dict:
                rc: 0

      # ── Trigger rescue: simulate NRestarts > 3 ───────────────────────────
      # failed_when: k3s_health_restarts.stdout | int > 3 evaluates True with stdout="5"
      # should_fail is deliberately absent: monkeyble ends the run at exit 0 on
      # an expected failure unless the failing task's immediate parent block has
      # a rescue, and import_role puts this playbook's rescue out of its reach.
      - task: "Verify k3s not in restart loop"
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: false
              result_dict:
                stdout: "5"
                rc: 0

      # ── Rescue path: rebuild succeeds ─────────────────────────────────────
      # ── Rescue path: version pin read from the servers before any teardown ──
      - task: "Read the k3s version the servers are running"
        should_be_skipped: false
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: false
              result_dict:
                resources:
                  - status:
                      nodeInfo:
                        kubeletVersion: "v1.31.5+k3s1"
                  - status:
                      nodeInfo:
                        kubeletVersion: "v1.31.5+k3s1"

      - task: "Uninstall k3s agent"
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: true
              result_dict:
                rc: 0

      - task: "Reinstall k3s agent"
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: true
              result_dict:
                rc: 0

      - task: "Wait for k3s-agent to become active after rebuild"
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: false
              result_dict:
                stdout: "active"
                rc: 0

      - task: "Wait for node to rejoin cluster after rebuild"
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: false
              result_dict:
                rc: 0

      - task: "Uncordon node after successful rebuild"
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: true
              result_dict:
                rc: 0

      # ── cordon_drain restore: scale the guarded workload back up ─────────────
      # StatefulSet default/nextcloud still carries the pre-drain annotations for
      # this node, so restore must scale it back and clear the annotations.
      - task: "Get StatefulSets for restore"
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: false
              result_dict:
                resources:
                  - metadata:
                      namespace: default
                      name: nextcloud
                      annotations:
                        homenet.vertesi.com/pre-drain-node: testnode
                        homenet.vertesi.com/pre-drain-replicas: "1"
                    spec:
                      replicas: 0

      # Assert restore matched this node's annotated workload (loop not empty).
      - task: "Scale StatefulSet back to pre-drain replica count"
        should_be_skipped: false
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: true
              result_dict:
                rc: 0

      - task: "Clear pre-drain annotations after restore"
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: true
              result_dict:
                rc: 0

      # ── Key assertions ────────────────────────────────────────────────────
      - task: "Alert WARNING — node auto-rebuilt and back in service"
        should_be_skipped: false   # assert it ran (not skipped)
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: false
