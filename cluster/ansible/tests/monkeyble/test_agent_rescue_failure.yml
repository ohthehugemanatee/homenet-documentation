---
# Scenario: upgrade health check fails, auto-rebuild also fails.
# Expected: CRITICAL Pushover alert fires, failure flag set.
monkeyble_scenarios:
  agent_rescue_failure:
    tasks_to_test: >-
      {{ monkeyble_scenarios.agent_rescue_failure.pre_tasks
         + monkeyble_shared_tasks
         + monkeyble_scenarios.agent_rescue_failure.post_tasks }}
    pre_tasks:
      # ── Mock infrastructure tasks that require a real cluster ──────────────

      - task: "Verify k8s node name matches ansible_hostname"
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: false
              result_dict:
                resources:
                  - metadata:
                      name: testnode

      - task: "Cordon node before drain"
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: true
              result_dict:
                rc: 0

      # ── cordon_drain scale_down: no single-replica workloads on this node ────
      # Empty cluster state → no scale-down targets; discovery must run, but
      # annotate/scale tasks must be skipped (empty loop).
      - task: "Find single-replica Longhorn StorageClasses"
        should_be_skipped: false
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: false
              result_dict:
                resources: []

      - task: "Find PersistentVolumeClaims on single-replica Longhorn StorageClasses"
        should_be_skipped: false
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: false
              result_dict:
                resources: []

      - task: "List pods scheduled on this node"
        should_be_skipped: false
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: false
              result_dict:
                resources: []

      - task: "Get StatefulSets"
        should_be_skipped: false
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: false
              result_dict:
                resources: []

      # Assert scale-down was skipped (no targets discovered).
      - task: "Record pre-drain replica count on StatefulSet"
        should_be_skipped: true

      - task: "Scale StatefulSet to zero"
        should_be_skipped: true

      - task: "Drain node"
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: true
              result_dict:
                rc: 0

    post_tasks:
      # ── k3s_health role ───────────────────────────────────────────────────

      - task: "Wait for k3s-agent to become active"
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: false
              result_dict:
                stdout: "active"
                rc: 0

      - task: "Uncordon node"
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: true
              result_dict:
                rc: 0

      - task: "Verify node is Ready"
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: false
              result_dict:
                rc: 0

      # ── Trigger rescue: simulate NRestarts > 3 ───────────────────────────
      # should_fail is deliberately absent: monkeyble ends the run at exit 0 on
      # an expected failure unless the failing task's immediate parent block has
      # a rescue, and import_role puts this playbook's rescue out of its reach.
      - task: "Verify k3s not in restart loop"
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: false
              result_dict:
                stdout: "5"
                rc: 0

      # ── Rescue path: rebuild fails → inner rescue fires ───────────────────
      - task: "Uninstall k3s agent"
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: true
              result_dict:
                rc: 0

      # Use ansible.builtin.fail as the mock module to trigger a real failure.
      - task: "Reinstall k3s agent"
        should_fail: true
        mock:
          config:
            ansible.builtin.fail:
              msg: "Mocked k3s reinstall failure (CI test)"

      # ── Key assertion ─────────────────────────────────────────────────────
      - task: "Alert CRITICAL — upgrade and rebuild both failed"
        should_be_skipped: false   # assert it ran (not skipped)
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: false
