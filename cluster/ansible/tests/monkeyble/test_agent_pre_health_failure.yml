---
# Scenario: the drain fails, so the run never reaches the health checks.
# Expected: no rebuild is attempted and k3s is left running on the node, with a
# CRITICAL Pushover alert naming the failing task.
monkeyble_scenarios:
  agent_pre_health_failure:
    # apt_upgrade and node_state never run: the drain fails before them, so the
    # shared mocks are not concatenated here.
    tasks_to_test: >-
      {{ monkeyble_scenarios.agent_pre_health_failure.pre_tasks
         + monkeyble_scenarios.agent_pre_health_failure.post_tasks }}
    pre_tasks:
      # ── upgrade_check role: mocked here rather than via monkeyble_shared_tasks,
      # since that file assumes apt_upgrade/node_state also run (they don't below).
      - task: "Update apt cache before drain check"
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: false

      - task: "Simulate dist-upgrade to check for pending packages"
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: true

      # ── Mock infrastructure tasks that require a real cluster ──────────────

      - task: "Verify k8s node name matches ansible_hostname"
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: false
              result_dict:
                resources:
                  - metadata:
                      name: testnode

      # ── cordon_drain wait_longhorn: no Longhorn replica on this node, as on a
      # control-plane node, so the gate must not wait on anything.
      - task: "List Longhorn replicas on this node"
        should_be_skipped: false
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: false
              result_dict:
                resources: []

      - task: "Wait for those volumes to report healthy"
        should_be_skipped: true

      - task: "Refuse to drain while a volume on this node is degraded"
        should_be_skipped: true

      # A real Snapshot CR still owns this ticket. The role must wait for it to
      # clear rather than removing it as orphaned.
      - task: "List Longhorn volume attachments"
        should_be_skipped: false
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: false
              result_dict:
                resources:
                  - metadata:
                      name: pvc-active-snapshot-ticket
                    spec:
                      attachmentTickets:
                        snapshot-controller-daily-sn-active:
                          id: snapshot-controller-daily-sn-active
                          nodeID: testnode
                          type: snapshot-controller

      - task: "List Longhorn snapshots"
        should_be_skipped: false
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: false
              result_dict:
                resources:
                  - metadata:
                      name: daily-sn-active

      - task: "Remove orphaned Longhorn snapshot attachment ticket"
        should_be_skipped: true

      - task: "Wait for Longhorn snapshot attachment ticket to clear"
        should_be_skipped: false
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: false
              result_dict:
                resources:
                  - spec:
                      attachmentTickets: {}

      - task: "Cordon node before drain"
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: true
              result_dict:
                rc: 0

      # ── cordon_drain scale_down: no single-replica workloads on this node ────
      # Empty cluster state → no scale-down targets; discovery must run, but
      # annotate/scale tasks must be skipped (empty loop).
      - task: "Find single-replica Longhorn StorageClasses"
        should_be_skipped: false
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: false
              result_dict:
                resources: []

      - task: "Find PersistentVolumeClaims on single-replica Longhorn StorageClasses"
        should_be_skipped: false
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: false
              result_dict:
                resources: []

      - task: "List pods scheduled on this node"
        should_be_skipped: false
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: false
              result_dict:
                resources: []

      - task: "Get StatefulSets"
        should_be_skipped: false
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: false
              result_dict:
                resources: []

      # Assert scale-down was skipped (no targets discovered).
      - task: "Record pre-drain replica count on StatefulSet"
        should_be_skipped: true

      - task: "Scale StatefulSet to zero"
        should_be_skipped: true

      # Use ansible.builtin.fail as the mock module to trigger a real failure.
      # should_fail is deliberately absent: it makes monkeyble end the run at the
      # failing task, and the play's rescue is what this scenario is testing.
      - task: "Drain node"
        mock:
          config:
            ansible.builtin.fail:
              msg: "Mocked drain failure (CI test)"

    post_tasks:
      # ── Key assertions ────────────────────────────────────────────────────
      # The rebuild block is gated off rather than aborted, so its tasks still
      # appear in the output as skipped. Assert the skip, including on the task
      # that would tear down a working k3s.
      - task: "Read the k3s version the servers are running"
        should_be_skipped: true

      - task: "Uninstall k3s agent"
        should_be_skipped: true

      - task: "Reinstall k3s agent"
        should_be_skipped: true

      - task: "Alert CRITICAL — upgrade failed before health checks"
        should_be_skipped: false
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: false
