---
# Scenario: upgrade health check fails, and the control-plane nodes report two
# different k3s versions.
# Expected: the rebuild refuses before the uninstall, so the node keeps a working
# k3s, and the CRITICAL Pushover alert fires.
monkeyble_scenarios:
  agent_rescue_version_split:
    tasks_to_test: >-
      {{ monkeyble_scenarios.agent_rescue_version_split.pre_tasks
         + monkeyble_no_snapshot_ticket_tasks
         + monkeyble_shared_tasks
         + monkeyble_scenarios.agent_rescue_version_split.post_tasks }}
    pre_tasks:
      # ── Mock infrastructure tasks that require a real cluster ──────────────

      - task: "Verify k8s node name matches ansible_hostname"
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: false
              result_dict:
                resources:
                  - metadata:
                      name: testnode

      - task: "Cordon node before drain"
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: true
              result_dict:
                rc: 0

      # ── cordon_drain scale_down: no single-replica workloads on this node ────
      # Empty cluster state → no scale-down targets; discovery must run, but
      # annotate/scale tasks must be skipped (empty loop).
      - task: "Find single-replica Longhorn StorageClasses"
        should_be_skipped: false
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: false
              result_dict:
                resources: []

      - task: "Find PersistentVolumeClaims on single-replica Longhorn StorageClasses"
        should_be_skipped: false
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: false
              result_dict:
                resources: []

      - task: "List pods scheduled on this node"
        should_be_skipped: false
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: false
              result_dict:
                resources: []

      - task: "Get StatefulSets"
        should_be_skipped: false
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: false
              result_dict:
                resources: []

      # Assert scale-down was skipped (no targets discovered).
      - task: "Record pre-drain replica count on StatefulSet"
        should_be_skipped: true

      - task: "Scale StatefulSet to zero"
        should_be_skipped: true

      - task: "Drain node"
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: true
              result_dict:
                rc: 0

    post_tasks:
      # ── k3s_health role ───────────────────────────────────────────────────

      - task: "Wait for k3s-agent to become active"
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: false
              result_dict:
                stdout: "active"
                rc: 0

      - task: "Uncordon node"
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: true
              result_dict:
                rc: 0

      - task: "Verify node is Ready"
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: false
              result_dict:
                rc: 0

      # ── Trigger rescue: simulate NRestarts > 3 ───────────────────────────
      # should_fail is deliberately absent: monkeyble ends the run at exit 0 on
      # an expected failure unless the failing task's immediate parent block has
      # a rescue, and import_role puts this playbook's rescue out of its reach.
      - task: "Verify k3s not in restart loop"
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: false
              result_dict:
                stdout: "5"
                rc: 0

      # ── Rescue path: version pin read from the servers before any teardown ──
      - task: "Read the k3s version the servers are running"
        should_be_skipped: false
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: false
              result_dict:
                resources:
                  - status:
                      nodeInfo:
                        kubeletVersion: "v1.31.6+k3s1"
                  - status:
                      nodeInfo:
                        kubeletVersion: "v1.31.5+k3s1"

      # ── Key assertions ────────────────────────────────────────────────────
      # The version assert aborts the block before the uninstall, so run-tests.sh
      # additionally asserts the uninstall task never appears in the run output.
      # Only the collector is mocked: the debug that consumes it runs for real, so
      # run-tests.sh can assert the collected text actually reaches the run log.
      # Listing that debug here would defeat the check, because monkeyble templates
      # a listed task's args before the register it reads is set.
      - task: "Collect k3s-agent state for the failure report"
        should_be_skipped: false
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: false
              result_dict:
                stdout_lines:
                  - "failed"
                  - "--- systemctl status ---"
                  - "Active: failed (Result: exit-code)"

      - task: "Alert CRITICAL — upgrade and rebuild both failed"
        should_be_skipped: false   # assert it ran (not skipped)
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: false
