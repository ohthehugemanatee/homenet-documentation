---
# Scenario: stage the calibre cutover — two workloads down, two source subPaths
# seeded onto one Longhorn volume, then both workloads deleted because adding
# volumeClaimTemplates to an existing StatefulSet is a forbidden in-place update.
# Runs against the real cluster/services/calibre.yaml, so it pins that shape too.

x_mocks:
  - &changed
    config:
      hpe.monkeyble.monkeyble_module:
        consider_changed: true
        result_dict: {}

monkeyble_scenarios:
  migrate_stage_calibre:
    tasks_to_test:

      - task: "Read the ArgoCD Application"
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: false
              result_dict:
                resources:
                  - metadata: {name: calibre, namespace: argocd}
                    spec:
                      syncPolicy:
                        automated: {prune: true, selfHeal: true}

      - task: "Derive the PVC the StatefulSet will adopt"
        test_output:
          - assert_equal:
              result_key: result.ansible_facts.migrate_pvc_name
              expected: "calibre-config-calibre-0"

      # calibre uses subPaths inside one volume, so the whole-/config shape
      # assert must not run for it.
      - task: "Assert the manifest is in the migrated shape"
        should_be_skipped: true

      - task: "Assert the volume claim template is on Longhorn"
        should_be_skipped: false

      - task: "Suspend ArgoCD auto-sync"
        mock: *changed

      - task: "Look for the workloads to scale down"
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: false
              result_dict:
                resources:
                  - metadata: {name: calibre, namespace: default}

      - task: "Scale the workload to zero"
        should_be_skipped: false
        mock: *changed

      - task: "Create the Longhorn PVC the StatefulSet will adopt"
        mock: *changed

      - task: "Run the config copy helper pod"
        mock: *changed

      - task: "Wait for the config copy helper pod to finish"
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: false
              result_dict:
                resources:
                  - metadata: {name: calibre-config-migrate}
                    status: {phase: Succeeded}

      - task: "Read the config copy helper pod log"
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: false
              result_dict:
                log: "calibre: 120 files\ncalibre-web: 8 files\ncopied 128 files\n"

      - task: "Assert the config copy succeeded"
        should_be_skipped: false

      - task: "Delete the config copy helper pod"
        should_be_skipped: false
        mock: *changed

      # Opt-in, and calibre is the only caller that sets it.
      - task: "Delete the workloads so the new spec can apply"
        should_be_skipped: false
        mock: *changed
