---
# Scenario: stage the ombi cutover end to end.
# ombi already carries the migrated shape, so preflight parses a real manifest —
# this scenario pins cluster/services/ombi.yaml as much as it does the playbook.
# Expected: sync policy saved, Deployment scaled to 0, PVC created from the
# volumeClaimTemplate, helper pod runs and is cleaned up.

# Most mocks just stand in for a k8s write. Anchor the two shapes once.
x_mocks:
  - &changed
    config:
      hpe.monkeyble.monkeyble_module:
        consider_changed: true
        result_dict: {}

monkeyble_scenarios:
  migrate_stage_success:
    tasks_to_test:

      - task: "Read the ArgoCD Application"
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: false
              result_dict:
                resources:
                  - metadata: {name: ombi, namespace: argocd}
                    spec:
                      syncPolicy:
                        automated: {prune: true, selfHeal: true}

      # The whole point of parsing the manifest instead of taking the PVC name as
      # a variable: a StatefulSet adopts <template>-<sts>-0 and silently
      # provisions an empty volume for anything else.
      - task: "Derive the PVC the StatefulSet will adopt"
        test_output:
          - assert_equal:
              result_key: result.ansible_facts.migrate_pvc_name
              expected: "ombi-config-ombi-0"

      # Asserts the parsed manifest cleared preflight rather than being skipped.
      - task: "Assert the manifest is in the migrated shape"
        should_be_skipped: false

      - task: "Assert the StatefulSet has a single replica"
        should_be_skipped: false

      - task: "Suspend ArgoCD auto-sync"
        mock: *changed

      - task: "Look for the app's Deployment"
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: false
              result_dict:
                resources:
                  - metadata: {name: ombi, namespace: default}
                    spec: {replicas: 1}

      # The Deployment exists, so the scale-down must not be skipped.
      - task: "Scale the Deployment to zero"
        should_be_skipped: false
        mock: *changed

      - task: "Create the Longhorn PVC the StatefulSet will adopt"
        mock: *changed

      - task: "Run the config copy helper pod"
        mock: *changed

      - task: "Wait for the config copy helper pod to finish"
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: false
              result_dict:
                resources:
                  - metadata: {name: ombi-config-migrate}
                    status: {phase: Succeeded}

      - task: "Read the config copy helper pod log"
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: false
              result_dict:
                log: "copied 42 files\n"

      - task: "Assert the config copy succeeded"
        should_be_skipped: false

      # always: block — the helper pod holds the RWO volume, so it must go.
      - task: "Delete the config copy helper pod"
        should_be_skipped: false
        mock: *changed
