---
# Mocks for the cordon_drain pre-cordon gate and the apt_upgrade + node_state role
# tasks shared by every rolling-upgrade.yaml agent scenario: pure plumbing, not the
# logic under test in any of them. Concatenated into each scenario's tasks_to_test
# via Jinja so this block exists in exactly one place (#338).
monkeyble_no_snapshot_ticket_tasks:
  - task: "List Longhorn volume attachments"
    mock:
      config:
        hpe.monkeyble.monkeyble_module:
          consider_changed: false
          result_dict:
            resources: []

  - task: "List Longhorn snapshots"
    mock:
      config:
        hpe.monkeyble.monkeyble_module:
          consider_changed: false
          result_dict:
            resources: []

monkeyble_shared_tasks:
  # ── cordon_drain wait_longhorn: a replica here, on a healthy volume, so the
  # gate is exercised and passes through. drain_gate_degraded_volume is where
  # the refusal is under test.
  - task: "List Longhorn replicas on this node"
    mock:
      config:
        hpe.monkeyble.monkeyble_module:
          consider_changed: false
          result_dict:
            resources:
              - metadata:
                  name: pvc-healthy-r-9c2a
                spec:
                  nodeID: testnode
                  volumeName: pvc-healthy

  - task: "Wait for those volumes to report healthy"
    mock:
      config:
        hpe.monkeyble.monkeyble_module:
          consider_changed: false
          result_dict:
            resources:
              - metadata:
                  name: pvc-healthy
                status:
                  state: attached
                  robustness: healthy

  # ── Mock upgrade_check role tasks — nothing under test upstream of the
  # upgrade block, and every scenario here exercises the "there is something
  # to upgrade" path, so the simulated dist-upgrade must report changed.
  - task: "Update apt cache before drain check"
    mock:
      config:
        hpe.monkeyble.monkeyble_module:
          consider_changed: false

  - task: "Simulate dist-upgrade to check for pending packages"
    mock:
      config:
        hpe.monkeyble.monkeyble_module:
          consider_changed: true

  # Mock apt tasks to avoid modifying the CI runner and for speed
  - task: "Update apt cache"
    mock:
      config:
        hpe.monkeyble.monkeyble_module:
          consider_changed: false

  - task: "Run dist-upgrade"
    mock:
      config:
        hpe.monkeyble.monkeyble_module:
          consider_changed: false   # prevents Reboot task from running

  # ── Mock node_state role tasks (configuration, not the logic under test) ──

  - task: "Install base packages"
    mock:
      config:
        hpe.monkeyble.monkeyble_module:
          consider_changed: false

  - task: "Install kernel extra modules package"
    mock:
      config:
        hpe.monkeyble.monkeyble_module:
