---
# Scenario: deliver a valid cert in separate format (shoebox shape) and prove
# the reload command fires because the copy actually changed the files.
# tls_cert_dest_cert/_key point under state_dir so nothing touches the host.

monkeyble_scenarios:
  tls_cert_delivers_and_reloads:
    tasks_to_test:

      - task: "Read the TLS Secret"
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: false
              result_dict:
                resources:
                  - data:
                      tls.crt: ""
                      tls.key: ""
