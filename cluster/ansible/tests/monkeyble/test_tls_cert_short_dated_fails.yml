---
# Scenario: a short-dated fixture cert (combined/Pi-hole format) must fail the
# run rather than deliver quietly — the guard against a delivery job that
# stops running and nobody notices until the cert expires.

monkeyble_scenarios:
  tls_cert_short_dated_fails:
    tasks_to_test:

      - task: "Read the TLS Secret"
        mock:
          config:
            hpe.monkeyble.monkeyble_module:
              consider_changed: false
              result_dict:
                resources:
                  - data:
                      tls.crt: ""
                      tls.key: ""

      - task: "Deliver the combined fullchain and key"
        should_be_skipped: false

      - task: "Assert the delivered certificate still has life left"
        should_fail: true
