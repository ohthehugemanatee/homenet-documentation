---
# Scale down a single StatefulSet for drain. Called from scale_down.yml in a loop.
# Expects `item` with .namespace and .name keys, and `cordon_drain_statefulsets`
# already registered from the parent.

# An operator-managed StatefulSet is reconciled back to the replica count on its
# owning custom resource, so patching the StatefulSet is undone within seconds.
# The owner holds the replica count that sticks. Restore re-derives this the same
# way in restore.yml.
- name: Resolve the object holding this StatefulSet's replica count
  vars:
    cordon_drain_ss: >-
      {{ cordon_drain_statefulsets.resources
         | selectattr('metadata.namespace', 'equalto', item.namespace)
         | selectattr('metadata.name', 'equalto', item.name) | first }}
    cordon_drain_controller: >-
      {{ cordon_drain_ss.metadata.ownerReferences | default([])
         | selectattr('controller', 'defined') | selectattr('controller')
         | list | first | default({}) }}
  ansible.builtin.set_fact:
    cordon_drain_target:
      api_version: "{{ cordon_drain_controller.apiVersion | default('apps/v1') }}"
      kind: "{{ cordon_drain_controller.kind | default('StatefulSet') }}"
      name: "{{ cordon_drain_controller.name | default(item.name) }}"

- name: Read the pre-drain replica count from that object
  kubernetes.core.k8s_info:
    api_version: "{{ cordon_drain_target.api_version }}"
    kind: "{{ cordon_drain_target.kind }}"
    namespace: "{{ item.namespace }}"
    name: "{{ cordon_drain_target.name }}"
    kubeconfig: "{{ k8s_kubeconfig }}"
  delegate_to: localhost
  become: false
  changed_when: false
  register: cordon_drain_target_obj

# Annotations stay on the StatefulSet: restore discovers work by listing
# StatefulSets, and an owner CR is not necessarily listable by that query.
- name: Record pre-drain replica count on StatefulSet
  kubernetes.core.k8s:
    state: patched
    kind: StatefulSet
    namespace: "{{ item.namespace }}"
    name: "{{ item.name }}"
    definition:
      metadata:
        annotations: >-
          {{ {cordon_drain_replicas_annotation:
                (cordon_drain_target_obj.resources | first).spec.replicas | string,
              cordon_drain_node_annotation: cordon_drain_node_name} }}
    kubeconfig: "{{ k8s_kubeconfig }}"
  delegate_to: localhost
  become: false

# k8s_scale patches the scale subresource as a strategic merge, which a custom
# resource rejects with 415; merge-patch on the object itself is accepted by both
# a CR and a StatefulSet. The Alertmanager CRD's scale subresource reads
# spec.replicas too, so the operator reacts the same either way.
- name: Scale StatefulSet to zero
  kubernetes.core.k8s:
    state: patched
    merge_type: merge
    api_version: "{{ cordon_drain_target.api_version }}"
    kind: "{{ cordon_drain_target.kind }}"
    namespace: "{{ item.namespace }}"
    name: "{{ cordon_drain_target.name }}"
    definition:
      spec:
        replicas: 0
    kubeconfig: "{{ k8s_kubeconfig }}"
  delegate_to: localhost
  become: false

# The drain needs the volume detached, which is what zero StatefulSet replicas
# means. The patch above only records intent for an operator-owned workload.
- name: Wait for the StatefulSet's pods to terminate
  kubernetes.core.k8s_info:
    kind: StatefulSet
    namespace: "{{ item.namespace }}"
    name: "{{ item.name }}"
    kubeconfig: "{{ k8s_kubeconfig }}"
  delegate_to: localhost
  become: false
  changed_when: false
  register: cordon_drain_scaled_ss
  until: >-
    (cordon_drain_scaled_ss.resources | length) == 0 or
    ((cordon_drain_scaled_ss.resources | first).status.replicas | default(0) | int) == 0
  retries: "{{ ((cordon_drain_scale_wait | int) / 10) | round | int }}"
  delay: 10
