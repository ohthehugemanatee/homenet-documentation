---
- name: Wait for Longhorn to finish rebuilding before cordoning
  ansible.builtin.include_tasks: wait_longhorn.yml
  when: cordon_drain_wait_for_longhorn | bool

- name: Cordon node before drain
  kubernetes.core.k8s_drain:
    name: "{{ ansible_hostname }}"
    state: cordon
    kubeconfig: "{{ k8s_kubeconfig }}"
  delegate_to: localhost
  become: false

# Read by upgrade_rescue_agent: a failure before this leaves the node schedulable,
# and its alert must not tell the operator to uncordon a node that never was.
- name: Record that the node is cordoned
  ansible.builtin.set_fact:
    cordon_drain_cordoned: true

- name: Scale down single-replica Longhorn workloads on this node
  ansible.builtin.include_tasks: scale_down.yml
  when: cordon_drain_scale_down_single_replica | bool

- name: Drain node  # noqa: command-instead-of-module
  ansible.builtin.command: >-
    kubectl drain {{ ansible_hostname }}
    --ignore-daemonsets
    --delete-emptydir-data
    --grace-period={{ cordon_drain_grace_period }}
    --timeout=300s
    --kubeconfig={{ k8s_kubeconfig }}
  delegate_to: localhost
  become: false
  changed_when: true
