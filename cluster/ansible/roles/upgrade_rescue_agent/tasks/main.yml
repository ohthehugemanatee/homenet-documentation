---
- name: Record play failure for subsequent plays
  ansible.builtin.file:
    path: "{{ state_dir }}/rolling-upgrade-failed"
    state: touch
    mode: '0644'
  delegate_to: localhost
  become: false
  failed_when: false  # must not abort rescue — alert tasks below must still run

# A failure before k3s_health means the node's k3s was never disturbed: the
# cluster, apt or node config failed, and uninstalling a working k3s cannot fix
# any of them. Alert and leave the node cordoned for an operator.
- name: Alert CRITICAL — upgrade failed before health checks
  ansible.builtin.uri:
    url: https://api.pushover.net/1/messages.json
    method: POST
    timeout: 10
    body_format: form-urlencoded
    body:
      token: "{{ pushover_app_token }}"
      user: "{{ pushover_user_key }}"
      message: >-
        CRITICAL: {{ inventory_hostname }} upgrade failed
        at task '{{ ansible_failed_task.name | default('unknown') }}'
        before health checks ran. No rebuild attempted, k3s left running.
        {{ cordon_drain_cordoned | default(false) | bool
           | ternary('Node DRAINED', 'Node still schedulable') }}.
        Manual fix required.
      priority: "2"
      retry: "300"
      expire: "3600"
  delegate_to: localhost
  become: false
  no_log: true
  changed_when: false
  when: not (k3s_health_checks_started | default(false) | bool)

- name: Attempt automatic node rebuild
  when: k3s_health_checks_started | default(false) | bool
  block:
    # Read before any teardown, so an undeterminable version fails while the
    # node still has a working k3s.
    - name: Read the k3s version the servers are running
      kubernetes.core.k8s_info:
        kind: Node
        label_selectors:
          - "node-role.kubernetes.io/control-plane"
        kubeconfig: "{{ k8s_kubeconfig }}"
      delegate_to: localhost
      become: false
      changed_when: false
      register: upgrade_rescue_agent_servers

    - name: Collect the distinct server k3s versions
      ansible.builtin.set_fact:
        upgrade_rescue_agent_server_versions: >-
          {{ upgrade_rescue_agent_servers.resources
             | map(attribute='status.nodeInfo.kubeletVersion')
             | unique | list }}

    # Refuse rather than pick: version strings do not sort correctly across a
    # two-digit minor (v1.9.0 sorts above v1.31.0), and an agent must never run
    # ahead of a server.
    - name: Require one server version before rebuilding
      ansible.builtin.assert:
        that:
          - upgrade_rescue_agent_server_versions | length == 1
        success_msg: "Rebuilding on k3s {{ upgrade_rescue_agent_server_versions | first }}"
        fail_msg: >-
          Control-plane nodes report
          {{ upgrade_rescue_agent_server_versions | join(', ') | default('no version', true) }}.
          Refusing to guess which version the rebuilt agent should join.

    - name: Uninstall k3s agent
      ansible.builtin.shell:
        cmd: /usr/local/bin/k3s-agent-uninstall.sh
        executable: /bin/bash
      failed_when: false
      changed_when: true

    - name: Reinstall k3s agent  # noqa: command-instead-of-module
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -o pipefail
          curl -sfL https://get.k3s.io | sh -s - agent
      environment:
        K3S_URL: "{{ k3s_api_server_url }}"
        K3S_TOKEN: "{{ k3s_token }}"
        INSTALL_K3S_VERSION: "{{ upgrade_rescue_agent_server_versions | first }}"
      changed_when: true
      no_log: true

    - name: Wait for k3s-agent to become active after rebuild  # noqa: command-instead-of-module
      ansible.builtin.command: systemctl is-active k3s-agent
      register: upgrade_rescue_agent_rebuilt
      until: upgrade_rescue_agent_rebuilt.rc == 0
      retries: 30
      delay: 10
      changed_when: false

    - name: Wait for node to rejoin cluster after rebuild
      kubernetes.core.k8s_info:
        kind: Node
        name: "{{ ansible_hostname }}"
        wait: true
        wait_condition:
          type: Ready
          status: "True"
        wait_timeout: 180
        kubeconfig: "{{ k8s_kubeconfig }}"
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Uncordon node after successful rebuild
      kubernetes.core.k8s_drain:
        name: "{{ ansible_hostname }}"
        state: uncordon
        kubeconfig: "{{ k8s_kubeconfig }}"
      delegate_to: localhost
      become: false

    - name: Restore single-replica Longhorn workloads scaled down before drain
      ansible.builtin.include_role:
        name: cordon_drain
        tasks_from: restore
      when: cordon_drain_scale_down_single_replica | default(true) | bool

    - name: Clear failure flag — rebuild succeeded, safe to continue
      ansible.builtin.file:
        path: "{{ state_dir }}/rolling-upgrade-failed"
        state: absent
      delegate_to: localhost
      become: false

    - name: Alert WARNING — node auto-rebuilt and back in service
      ansible.builtin.uri:
        url: https://api.pushover.net/1/messages.json
        method: POST
        timeout: 10
        body_format: form-urlencoded
        body:
          token: "{{ pushover_app_token }}"
          user: "{{ pushover_user_key }}"
          message: "WARNING: {{ inventory_hostname }} upgrade failed; auto-rebuilt, back in service."
          priority: "1"
      delegate_to: localhost
      become: false
      no_log: true
      changed_when: false

  rescue:
    # The reinstall above is no_log (K3S_TOKEN in its environment), so nothing it
    # printed reaches the run log. Node journald is Storage=volatile, so the run
    # log is the only record that survives a reboot.
    - name: Collect k3s-agent state for the failure report
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -o pipefail
          systemctl is-active k3s-agent || true
          echo '--- systemctl status ---'
          systemctl status k3s-agent --no-pager --lines=0 || true
          echo '--- journal (last 50) ---'
          journalctl -u k3s-agent --no-pager --lines=50 || true
          echo '--- k3s mounts still present ---'
          mount | grep -E '/var/lib/kubelet|/run/k3s' || true
      register: upgrade_rescue_agent_diagnostics
      changed_when: false
      failed_when: false      # must not mask the rebuild failure being reported
      ignore_unreachable: true

    - name: Report k3s-agent state
      ansible.builtin.debug:
        msg: "{{ upgrade_rescue_agent_diagnostics.stdout_lines
                 | default(['node unreachable, no diagnostics collected']) }}"

    - name: Alert CRITICAL — upgrade and rebuild both failed
      ansible.builtin.uri:
        url: https://api.pushover.net/1/messages.json
        method: POST
        timeout: 10
        body_format: form-urlencoded
        body:
          token: "{{ pushover_app_token }}"
          user: "{{ pushover_user_key }}"
          message: >-
            CRITICAL: {{ inventory_hostname }} upgrade+rebuild failed
            at task '{{ ansible_failed_task.name | default('unknown') }}';
            k3s-agent is
            {{ (upgrade_rescue_agent_diagnostics.stdout_lines | default(['unknown']))[0] }}.
            Node DRAINED. Manual fix required.
          priority: "2"
          retry: "300"
          expire: "3600"
      delegate_to: localhost
      become: false
      no_log: true
      changed_when: false
