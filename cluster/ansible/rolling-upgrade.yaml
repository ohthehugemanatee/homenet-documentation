---
# Rolling OS upgrade for k3s nodes.
# Checks every targeted node in parallel first (apt cache + a check-mode
# dist-upgrade dry run + a reboot-required stat), then drains each node with
# pending work, runs apt dist-upgrade, reboots, uncordons, verifies Ready —
# one at a time. Safe to re-run — a node with nothing pending is skipped
# before it is ever cordoned or drained.
#
# Prerequisites:
#   - kubernetes.core collection installed; kubernetes Python library available
#   - ansible-playbook run from a machine with kubectl access
#
# Usage:
#   All nodes (rolling):  ansible-playbook -i inventory.yaml --vault-password-file /etc/ansible/vault-password \
#                           -e vault_file=group_vars/vault.yaml rolling-upgrade.yaml
#   Single node:          ansible-playbook -i inventory.yaml --vault-password-file /etc/ansible/vault-password \
#                           -e vault_file=group_vars/vault.yaml --limit cluster1 rolling-upgrade.yaml
#   Testing (no vault):   ansible-playbook -i tests/monkeyble/inventory.yml \
#                           -e vault_file=tests/monkeyble/test_secrets.yml rolling-upgrade.yaml
#
# Node ordering: agents first, then multimasters, then masters (first-master last).
# Override with --limit or -e target=<group>.
#
# strict_mode=true (strongly recommended for scheduled runs):
#   - Stops on first node failure (any_errors_fatal)
#   - Aborts subsequent plays if a prior play left nodes failed/drained
#
# WARNING: draining a k3s server node evicts non-system pods but leaves the
# control plane processes running. HA clusters (3 servers) tolerate this fine.
# Do NOT run this against all 3 servers simultaneously — serial: 1 prevents that.
#
# Single-replica (strict-local) Longhorn StatefulSets that would block the drain
# on Longhorn's instance-manager PodDisruptionBudget are scaled down before the
# drain and restored after the node is healthy — handled by the cordon_drain /
# k3s_health roles. No manual scaling needed.
#
# cordon_drain waits until volumes with replicas on the node are done rebuilding.
# timeout leaves the node schedulable.

- name: Check all nodes for pending work
  hosts: "{{ target | default('agents:!ubuntu:multimasters:masters') }}"
  become: true

  tasks:
    - name: Check if there is anything to upgrade
      ansible.builtin.import_role:
        name: upgrade_check

    - name: Report per-node upgrade status
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} ({{ ansible_distribution }} {{ ansible_distribution_version }}):
          {{ 'upgrade needed' if upgrade_check_needed else 'already up to date' }}


- name: Rolling OS upgrade — agents
  hosts: "{{ target | default('agents:!ubuntu') }}"
  become: true
  serial: 1
  any_errors_fatal: "{{ strict_mode | default(false) | bool }}"

  vars_files:
    - "{{ vault_file }}"

  vars:
    k3s_svc: k3s-agent
    k8s_kubeconfig: "{{ lookup('env', 'KUBECONFIG') or (lookup('env', 'HOME') + '/.kube/config') }}"

  pre_tasks:
    - name: Initialize upgrade state and verify node
      ansible.builtin.import_role:
        name: upgrade_pre_state

  tasks:
    - name: Show current OS version
      ansible.builtin.command: lsb_release -ds
      register: os_version
      changed_when: false

    - name: Node is up to date — skipping upgrade
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} ({{ os_version.stdout }}) has nothing to upgrade — not draining."
      when: not upgrade_check_needed

    - name: Upgrade node
      when: upgrade_check_needed
      block:
        - name: Starting upgrade of {{ inventory_hostname }}
          ansible.builtin.debug:
            msg: "Starting upgrade of {{ inventory_hostname }} ({{ os_version.stdout }})"

        - name: Cordon and drain node
          ansible.builtin.import_role:
            name: cordon_drain

        - name: Run apt dist-upgrade and reboot
          ansible.builtin.import_role:
            name: apt_upgrade

        - name: Apply node state configuration
          ansible.builtin.import_role:
            name: node_state

        - name: Verify k3s health and uncordon
          ansible.builtin.import_role:
            name: k3s_health

        - name: Show post-upgrade OS version
          ansible.builtin.command: lsb_release -ds
          register: os_version_after
          changed_when: false

        - name: Upgrade complete — {{ inventory_hostname }}
          ansible.builtin.debug:
            msg: "{{ inventory_hostname }} upgraded successfully: {{ os_version_after.stdout }}"

      rescue:
        - name: Attempt agent rebuild on failure
          ansible.builtin.import_role:
            name: upgrade_rescue_agent


- name: Rolling OS upgrade — multi-master servers
  hosts: "{{ target | default('multimasters') }}"
  become: true
  serial: 1
  any_errors_fatal: "{{ strict_mode | default(false) | bool }}"

  vars_files:
    - "{{ vault_file }}"

  vars:
    k3s_svc: k3s
    k8s_kubeconfig: "{{ lookup('env', 'KUBECONFIG') or (lookup('env', 'HOME') + '/.kube/config') }}"
    cordon_drain_grace_period: 60
    apt_upgrade_post_reboot_delay: 20
    k3s_health_wait_before_uncordon: true
    k3s_health_node_ready_timeout: 180

  pre_tasks:
    - name: Check prior-play failures and CP quorum
      ansible.builtin.import_role:
        name: upgrade_checks_cp

  tasks:
    - name: Show current OS version
      ansible.builtin.command: lsb_release -ds
      register: os_version
      changed_when: false

    - name: Node is up to date — skipping upgrade
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} ({{ os_version.stdout }}) has nothing to upgrade — not draining."
      when: not upgrade_check_needed

    - name: Upgrade node
      when: upgrade_check_needed
      block:
        - name: Starting upgrade of {{ inventory_hostname }}
          ansible.builtin.debug:
            msg: "Starting upgrade of multi-master {{ inventory_hostname }} ({{ os_version.stdout }})"

        - name: Cordon and drain node
          ansible.builtin.import_role:
            name: cordon_drain

        - name: Run apt dist-upgrade and reboot
          ansible.builtin.import_role:
            name: apt_upgrade

        - name: Apply node state configuration
          ansible.builtin.import_role:
            name: node_state

        - name: Verify k3s health and uncordon
          ansible.builtin.import_role:
            name: k3s_health

        - name: Show post-upgrade OS version
          ansible.builtin.command: lsb_release -ds
          register: os_version_after
          changed_when: false

        - name: Upgrade complete — {{ inventory_hostname }}
          ansible.builtin.debug:
            msg: "{{ inventory_hostname }} upgraded successfully: {{ os_version_after.stdout }}"

      rescue:
        - name: Alert and record CP upgrade failure
          ansible.builtin.import_role:
            name: upgrade_rescue_cp


- name: Rolling OS upgrade — first master (last)
  hosts: "{{ target | default('masters') }}"
  become: true
  serial: 1
  any_errors_fatal: "{{ strict_mode | default(false) | bool }}"

  vars_files:
    - "{{ vault_file }}"

  vars:
    k3s_svc: k3s
    k8s_kubeconfig: "{{ lookup('env', 'KUBECONFIG') or (lookup('env', 'HOME') + '/.kube/config') }}"
    cordon_drain_grace_period: 60
    apt_upgrade_post_reboot_delay: 30
    k3s_health_wait_before_uncordon: true
    k3s_health_wait_retries: 36
    k3s_health_node_ready_timeout: 300

  pre_tasks:
    - name: Check prior-play failures and CP quorum
      ansible.builtin.import_role:
        name: upgrade_checks_cp

  tasks:
    - name: Show current OS version
      ansible.builtin.command: lsb_release -ds
      register: os_version
      changed_when: false

    - name: Node is up to date — skipping upgrade
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} ({{ os_version.stdout }}) has nothing to upgrade — not draining."
      when: not upgrade_check_needed

    - name: Upgrade node
      when: upgrade_check_needed
      block:
        - name: Starting upgrade of {{ inventory_hostname }}
          ansible.builtin.debug:
            msg: >
              Starting upgrade of first-master {{ inventory_hostname }} ({{ os_version.stdout }}).
              Ensure kubectl is configured to reach the cluster via a VIP or
              another server in case this node's API server is briefly unavailable.

        - name: Cordon and drain node
          ansible.builtin.import_role:
            name: cordon_drain

        - name: Run apt dist-upgrade and reboot
          ansible.builtin.import_role:
            name: apt_upgrade

        - name: Apply node state configuration
          ansible.builtin.import_role:
            name: node_state

        - name: Verify k3s health and uncordon
          ansible.builtin.import_role:
            name: k3s_health

        - name: Get final cluster node status
          kubernetes.core.k8s_info:
            kind: Node
            kubeconfig: "{{ k8s_kubeconfig }}"
          delegate_to: localhost
          become: false
          changed_when: false
          register: final_nodes

        - name: Final cluster state
          ansible.builtin.debug:
            msg: >-
              {{ item.metadata.name }}: {{ item.status.conditions |
              selectattr('type', 'equalto', 'Ready') |
              map(attribute='status') | first | default('Unknown') }}
          loop: "{{ final_nodes.resources }}"
          loop_control:
            label: "{{ item.metadata.name }}"

        - name: Show post-upgrade OS version
          ansible.builtin.command: lsb_release -ds
          register: os_version_after
          changed_when: false

        - name: Upgrade complete — {{ inventory_hostname }}
          ansible.builtin.debug:
            msg: "{{ inventory_hostname }} upgraded successfully: {{ os_version_after.stdout }}"

      rescue:
        - name: Alert and record CP upgrade failure
          ansible.builtin.import_role:
            name: upgrade_rescue_cp


- name: Cleanup — clear maintenance flag
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Clear maintenance flag
      ansible.builtin.file:
        path: "{{ state_dir }}/maintenance-in-progress"
        state: absent
