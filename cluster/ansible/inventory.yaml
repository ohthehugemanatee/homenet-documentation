all:
  vars:
    ansible_user: ubuntu
    # usb_disk: "" # Set this var on the command line if an external disk is in use.
  children:
    cluster:
      children:
        masters:
          hosts:
            cluster1:
              ip: 10.10.10.10
              cluster_role: "first-master"
          vars:
            # 4 GB Pi control-plane nodes with root on SD card: enable the memory
            # cushion (zram). USB offload is auto-derived from cluster_role.
            node_state_zram_enabled: true
        multimasters:
          hosts:
            cluster3:
              ansible_host: 10.10.10.111
            cluster4:
              ansible_host: 10.10.10.114
          vars:
            cluster_role: "multi-master"
            node_state_zram_enabled: true
        agents:
          hosts:
            nuc1:
              ansible_user: ohthehugemanatee
            nuc2:
            fuji:
              ansible_user: ohthehugemanatee
            celery:
              ansible_user: ohthehugemanatee
            ubuntu:
          vars:
            cluster_role: "agent"
    shoebox:
      hosts:
        shoebox:
          ansible_host: 10.10.10.127
          ansible_user: ubuntu
    # Hosts deliver-tls-certs.yaml delivers cluster-issued certificates to.
    # Connection vars come from the group above; a host may be in both.
    tls_clients:
      hosts:
        shoebox:
          tls_deliveries:
            - secret: shoebox-tls
              namespace: offcluster-tls
              format: separate
              dest_cert: /etc/ssl/shoebox/tls.crt
              dest_key: /etc/ssl/shoebox/tls.key
              owner: root
              group: root
              mode: "0640"
              # Nothing reads these files yet; #366's reverse proxy sets the
              # command that restarts it.
              reload_command: /bin/true
