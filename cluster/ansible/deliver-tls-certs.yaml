---
# Deliver cluster-issued TLS certificates to the tls_clients hosts.
# Contract (including why it reads no vault secrets): cluster/ansible/CLAUDE.md.
# Schedule: monitoring-and-compliance.md. Issuance: cert-manager.md.
#
# Usage:
#   ansible-playbook -i inventory.yaml deliver-tls-certs.yaml
#   Single host:  ... --limit shoebox

- name: Deliver cluster-issued certificates to off-cluster hosts
  hosts: tls_clients
  become: true
  serial: 1
  gather_facts: false

  vars:
    k8s_kubeconfig: "{{ lookup('env', 'KUBECONFIG') or (lookup('env', 'HOME') + '/.kube/config') }}"
    # Provisioned by shoebox/shoebox-ansible-setup.yaml. If it is missing the
    # alert task below fails, so a failed delivery goes red without alerting.
    tls_pushover_env: /etc/ansible/pushover.env

  tasks:
    - name: Deliver every certificate this host serves
      block:
        # ansible.builtin.copy does not create missing parent directories.
        - name: Create the destination directories
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            owner: root
            group: root
            mode: "0755"
          loop: >-
            {{ ((tls_deliveries | map(attribute='dest_cert') | list)
                + (tls_deliveries | selectattr('dest_key', 'defined')
                   | map(attribute='dest_key') | list))
               | map('dirname') | unique }}

        # One delivery per host: the role's copy registers are host facts that
        # outlive the iteration, so a second entry in a different format could
        # fire the first entry's reload command.
        - name: Deliver the certificate
          ansible.builtin.include_role:
            name: tls_cert
          vars:
            tls_cert_secret: "{{ delivery.secret }}"
            tls_cert_namespace: "{{ delivery.namespace }}"
            tls_cert_format: "{{ delivery.format }}"
            tls_cert_dest_cert: "{{ delivery.dest_cert }}"
            tls_cert_dest_key: "{{ delivery.dest_key | default(omit) }}"
            tls_cert_owner: "{{ delivery.owner }}"
            tls_cert_group: "{{ delivery.group }}"
            tls_cert_mode: "{{ delivery.mode }}"
            tls_cert_reload_command: "{{ delivery.reload_command }}"
          loop: "{{ tls_deliveries }}"
          loop_control:
            loop_var: delivery

      rescue:
        # Unrecovered failure, so CRITICAL per the severity contract in
        # cluster/ansible/CLAUDE.md.
        - name: Alert CRITICAL — TLS certificate delivery failed
          ansible.builtin.uri:
            url: https://api.pushover.net/1/messages.json
            method: POST
            timeout: 10
            body_format: form-urlencoded
            body:
              token: "{{ lookup('ansible.builtin.ini', 'PUSHOVER_TOKEN', file=tls_pushover_env, type='properties') }}"
              user: "{{ lookup('ansible.builtin.ini', 'PUSHOVER_USER', file=tls_pushover_env, type='properties') }}"
              message: >-
                CRITICAL: TLS certificate delivery to {{ inventory_hostname }}
                failed at task "{{ ansible_failed_task.name | default('unknown') }}".
                The host keeps the certificate it already has until it expires.
              priority: "2"
              retry: "300"
              expire: "3600"
          delegate_to: localhost
          become: false
          no_log: true
          changed_when: false

        - name: Fail the run after alerting
          ansible.builtin.fail:
            msg: >-
              TLS certificate delivery to {{ inventory_hostname }} failed at
              "{{ ansible_failed_task.name | default('unknown') }}"
