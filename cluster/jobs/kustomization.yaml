---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - backup-verify.yaml
configMapGenerator:
  - name: backup-verify-scripts
    namespace: backup-verify
    files:
      - backup_currency.py
      - restore_target.py
      - restore.sh
generatorOptions:
  disableNameSuffixHash: true
