alloy:
  configMap:
    content: |
      // Pods on THIS node only. Each DaemonSet replica tails the log files its
      // own node wrote, so a cluster-wide discovery would just glob paths that
      // do not exist locally.
      discovery.kubernetes "pods" {
        role = "pod"

        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("NODE_NAME")
        }
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node_name"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          target_label  = "job"
        }

        // The kubelet lays logs out as
        // /var/log/pods/<namespace>_<pod>_<uid>/<container>/<n>.log, so the
        // leading wildcard stands in for the namespace and pod name.
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          replacement   = "/var/log/pods/*$1/*.log"
          target_label  = "__path__"
        }
      }

      local.file_match "pods" {
        path_targets = discovery.relabel.pods.output
      }

      loki.source.file "pods" {
        targets    = local.file_match.pods.targets
        forward_to = [loki.process.pods.receiver]
      }

      // containerd writes CRI-format lines: "<ts> <stream> <flag> <message>".
      // Without this stage the timestamp and stream stay glued to the message.
      loki.process "pods" {
        stage.cri {}

        forward_to = [loki.write.loki.receiver]
      }

      loki.write "loki" {
        endpoint {
          url = "http://loki.loki.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

  mounts:
    # Pod logs are read from the node's own disk, never streamed through the
    # kube-apiserver: a log tail must not depend on the control plane.
    varlog: true
    extra:
      # On the Pi control planes /var/log/pods is a symlink to
      # /mnt/usb/log/pods, so mounting /var/log alone leaves the tails
      # resolving through a dangling symlink and collecting nothing. Mounted at
      # its host path so the symlink resolves to the same place it does on the
      # node. The workers keep a real /var/log/pods and never read this.
      - name: usb-pod-logs
        mountPath: /mnt/usb/log
        readOnly: true

  # The kubelet writes pod logs 0640 root:root.
  securityContext:
    runAsUser: 0

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

  # NODE_NAME is referenced by the discovery field selector above to scope log
  # collection to pods on this node. Populated from the pod's own spec.nodeName.
  extraEnv:
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName

controller:
  type: daemonset

  volumes:
    extra:
      # DirectoryOrCreate because only the Pis have a USB disk; on the workers
      # this makes an empty directory that nothing reads.
      - name: usb-pod-logs
        hostPath:
          path: /mnt/usb/log
          type: DirectoryOrCreate

  # Alloy reads each node's logs off that node's disk, so it has to run on the
  # control planes to collect theirs.
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: node-role.kubernetes.io/master
      operator: Exists
      effect: NoSchedule
