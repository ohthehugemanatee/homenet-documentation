grafana:
  enabled: true
  sidecar:
    # k3s CA cert lacks Authority Key Identifier extension;
    # Python 3.13+ in the sidecar image rejects it.
    # Tracked: regenerate k3s CA with AKI/SKI extensions.
    skipTlsVerify: true
  persistence:
    # Dashboards and datasources come from the sidecar and additionalDataSources
    # below, so only users and API keys are unreconstructible. Two replicas with
    # read locality, not the 3-replica cluster default this fell through to.
    enabled: true
    storageClassName: longhorn-performance
  ingress:
    enabled: true
    hosts:
      - grafana.berlin.vertesi.com
    tls:
      - hosts:
          - grafana.berlin.vertesi.com
  nodeSelector:
    kubernetes.io/arch: amd64
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki.loki.svc.cluster.local:3100
      access: proxy
      isDefault: false
    - name: Alertmanager
      type: alertmanager
      url: http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093
      access: proxy
      jsonData:
        implementation: prometheus

alertmanager:
  enabled: true
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          # Silences and the notification log are regenerable: losing them
          # re-fires undelivered notifications. Cheaper than replicating every
          # alert transition over the network.
          storageClassName: "longhorn-ephemeral"
          resources:
            requests:
              storage: 1Gi
    nodeSelector:
      kubernetes.io/arch: amd64
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi
    secrets:
      - alertmanager-pushover
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: pushover
      # Group by namespace so .CommonLabels.namespace is set per group and the
      # Grafana deep link below resolves to the firing workload's namespace.
      group_by: ['alertname', 'namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
    receivers:
      - name: "null"
      - name: pushover
        pushover_configs:
          - token_file: /etc/alertmanager/secrets/alertmanager-pushover/token
            user_key_file: /etc/alertmanager/secrets/alertmanager-pushover/user_key
            title: 'k8s alert: {{ .GroupLabels.alertname }}'
            message: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
            priority: "0"
            # Deep link to workload-debug dashboard, pre-scoped to firing namespace/pod.
            url: 'https://grafana.berlin.vertesi.com/d/workload-debug?var-namespace={{ .CommonLabels.namespace }}&var-pod={{ .CommonLabels.pod }}'
            url_title: 'Debug in Grafana'

# k3s embeds controller-manager, scheduler, proxy, and etcd inside
# the k3s server process — no separate pods or scrape endpoints exist.
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false

# kubelet duplicates apiserver families
kubelet:
  serviceMonitor:
    metricRelabelings:
      - sourceLabels: [__name__]
        regex: "(apiserver|etcd)_.*"
        action: drop

# defaultRules still ships the *Down alerts for these components even with
# their scrape jobs disabled above; on k3s they have no targets and fire as
# false positives. Disable them by name.
defaultRules:
  disabled:
    KubeControllerManagerDown: true
    KubeProxyDown: true
    KubeSchedulerDown: true

prometheus:
  prometheusSpec:
    # Halves samples per second across every target at once. The default rules
    # all range over 5m or more, so each still sees five samples per window.
    scrapeInterval: 60s
    retention: 15d
    # Time-based retention alone lets series growth fill the 30Gi volume, and a
    # full Longhorn volume is a worse failure than a short retention window.
    # WAL and m-mapped chunks count toward this total but are never evicted, so
    # the cap needs headroom well below the volume size.
    retentionSize: 20GiB
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: "longhorn-ephemeral"
          resources:
            requests:
              storage: 30Gi
    nodeSelector:
      kubernetes.io/arch: amd64
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        # 1Gi OOMKilled the pod whenever an apiserver burnrate rule evaluated
        # over its 3d range.
        memory: 2Gi
