deploymentMode: Monolithic

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    retention_period: 168h
    reject_old_samples: true
    reject_old_samples_max_age: 168h
  compactor:
    retention_enabled: true
    delete_request_store: filesystem

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: "longhorn-ephemeral"
    size: 5Gi
  nodeSelector:
    kubernetes.io/arch: amd64
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

# Both caches stay on: they absorb chunk and query reads that would otherwise
# hit the Longhorn volume, which is this cluster's tightest resource. Only the
# sizing changes. Chart defaults allocate 8192MB + 1024MB, which it turns into
# 9830Mi + 1229Mi of requests *and* limits at 500m CPU each; singleBinary's
# volume caps the whole chunk store at 5Gi, so an 8GB chunk cache is larger
# than the data it caches.
#
# persistence stays disabled (chart default). Enabling it moves the cache to
# memcached extstore on disk, which is the opposite of the point.
chunksCache:
  allocatedMemory: 1024
  allocatedCPU: 100m
  # Buffer inside the Loki process, not memcached. 500MB against singleBinary's
  # 512Mi limit is an OOM; upstream's monolithic-values.yaml uses 10MB.
  writebackSizeLimit: 10MB

resultsCache:
  allocatedMemory: 256
  allocatedCPU: 100m
  writebackSizeLimit: 10MB

sidecar:
  # k3s CA cert lacks Authority Key Identifier extension;
  # Python 3.13+ in the sidecar image rejects it.
  # Tracked: regenerate k3s CA with AKI/SKI extensions.
  skipTlsVerify: true

gateway:
  enabled: false

backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

# The helm test hook only scrapes the canary below.
test:
  enabled: false

# Writes through loki-gateway, which gateway.enabled: false never creates.
lokiCanary:
  enabled: false
