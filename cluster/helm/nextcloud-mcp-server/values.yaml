image:
  # Pin explicitly; check https://github.com/cbcoutinho/nextcloud-mcp-server/releases
  # for the current stable tag before bumping.
  tag: "0.165.0"

nextcloud:
  host: https://germany.vertesi.com
  # Both default correctly from ingress.hosts[0] and nextcloud.host, but they
  # are the OAuth identity — pinned so an unrelated ingress edit can't silently
  # move the redirect URI or the token issuer.
  mcpServerUrl: https://mcp.germany.vertesi.com
  publicIssuerUrl: https://germany.vertesi.com

auth:
  # Login Flow v2: Nextcloud's own OpenID Connect provider (oidc) app is the
  # IdP. Mounts the OAuth 2.1 facade claude.ai's Connectors UI requires —
  # auth.mode: basic registers no OAuth routes at all, so Connectors 404.
  # The chart derives --oauth and MCP_DEPLOYMENT_MODE=login_flow from this.
  mode: login-flow
  loginFlow:
    # CHANGEME: created out-of-band, never committed. See nextcloud-mcp.md for
    # how to register the OIDC client in Nextcloud and create this secret:
    #   kubectl create secret generic nextcloud-mcp-oauth \
    #     --from-literal=token_encryption_key=<CHANGEME_fernet_key> \
    #     --from-literal=client_id=<CHANGEME_oidc_client_id> \
    #     --from-literal=client_secret=<CHANGEME_oidc_client_secret> \
    #     -n default
    existingSecret: nextcloud-mcp-oauth
    # Must be set even though it names the same Secret: the chart gates the
    # OIDC client env vars on `or .clientId .oidcExistingSecret` — plain
    # `existingSecret` does NOT satisfy it. Without this the server silently
    # drops NEXTCLOUD_OIDC_CLIENT_ID/_SECRET and falls back to Dynamic Client
    # Registration, which the oidc app garbage-collects after an hour and
    # permanently breaks the connector.
    oidcExistingSecret: nextcloud-mcp-oauth

dataStorage:
  # login-flow turns this on implicitly; declared explicitly so the volume is
  # visible here. Holds tokens.db — the per-user Nextcloud app passwords,
  # encrypted with token_encryption_key — so it must survive restarts.
  enabled: true
  storageClass: longhorn
  size: 1Gi

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/redirect-entry-point: https
  hosts:
    - host: mcp.germany.vertesi.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - mcp.germany.vertesi.com
      secretName: mcp-germany-vertesi-com-tls

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi
