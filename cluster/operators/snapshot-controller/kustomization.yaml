# Pinned to the csi-snapshotter tag the Longhorn chart ships; bump both together.
# .github/scripts/check_snapshotter_pin.py fails CI when they disagree.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/kubernetes-csi/external-snapshotter/client/config/crd?ref=v8.6.0
  - https://github.com/kubernetes-csi/external-snapshotter/deploy/kubernetes/snapshot-controller?ref=v8.6.0
images:
  # Upstream's manifest at a tag can still name the previous release's image.
  - name: registry.k8s.io/sig-storage/snapshot-controller
    newTag: v8.6.0
patches:
  - target:
      kind: Deployment
      name: snapshot-controller
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: snapshot-controller
        namespace: kube-system
      spec:
        template:
          spec:
            containers:
              - name: snapshot-controller
                resources:
                  # The binary maps ~62 MiB of text and rodata (ADR-0006).
                  requests:
                    cpu: 10m
                    memory: 96Mi
                  limits:
                    memory: 96Mi
