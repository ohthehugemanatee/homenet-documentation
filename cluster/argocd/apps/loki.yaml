apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    notifications.argoproj.io/subscribe.on-sync-status-unknown.pushover: ""
spec:
  project: default
  sources:
    - repoURL: https://github.com/ohthehugemanatee/homenet-documentation.git
      targetRevision: HEAD
      ref: values
    - chart: loki
      repoURL: ghcr.io/grafana-community/helm-charts
      # Single source of truth for the pin. install-loki.sh and the CI dry-run
      # both read it from here.
      targetRevision: 18.11.7
      helm:
        valueFiles:
          - $values/cluster/helm/loki/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: loki
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
