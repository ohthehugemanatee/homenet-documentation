---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: snapshot-controller
  namespace: argocd
  # No finalizer: deleting the CRDs deletes every VolumeSnapshot.
  annotations:
    notifications.argoproj.io/subscribe.on-out-of-sync.pushover: ""
spec:
  project: default
  source:
    repoURL: https://github.com/ohthehugemanatee/homenet-documentation.git
    targetRevision: HEAD
    path: cluster/operators/snapshot-controller
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  # Manual sync, infra tier: the pin moves with Longhorn's.
  syncPolicy:
    syncOptions:
      # CRDs exceed apply limit.
      - ServerSideApply=true
