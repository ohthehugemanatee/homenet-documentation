---
# Identity for the Longhorn PreSync gate (#280). Read on the two collections
# the gate inspects and nothing else: it decides whether a sync may proceed and
# never changes anything.
#
# All three are PreSync hooks at wave -1, alongside the ConfigMap and ahead of
# the Job at wave 0. Left as plain resources they would be applied in the main
# sync, which runs *after* PreSync, and the first sync on a fresh cluster would
# be rejected at admission for naming a ServiceAccount that does not exist yet.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: longhorn-preflight
  namespace: longhorn-system
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: longhorn-preflight
  namespace: longhorn-system
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
rules:
  # No write verbs, and no other longhorn.io resource. Settings and
  # BackupTargets are deliberately absent: the gate reads volume health, not
  # configuration.
  - apiGroups: ["longhorn.io"]
    resources: ["volumes", "backingimages"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: longhorn-preflight
  namespace: longhorn-system
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
subjects:
  - kind: ServiceAccount
    name: longhorn-preflight
    namespace: longhorn-system
roleRef:
  kind: Role
  name: longhorn-preflight
  apiGroup: rbac.authorization.k8s.io
