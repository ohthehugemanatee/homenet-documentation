---
# See cluster/argocd/CLAUDE.md.
apiVersion: batch/v1
kind: Job
metadata:
  name: longhorn-preflight
  namespace: longhorn-system
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 120
  template:
    metadata:
      name: longhorn-preflight
    spec:
      serviceAccountName: longhorn-preflight
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: preflight
          image: python:3.12-alpine
          command: ["python3", "/hook/preflight.py"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: hook
              mountPath: /hook
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        - name: hook
          configMap:
            name: longhorn-preflight
