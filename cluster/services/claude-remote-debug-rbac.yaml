---
# Read-only identity for ad-hoc cluster debugging from a Claude Code remote
# session (see remote-debugging.md). Bound to the built-in `view` ClusterRole,
# which excludes Secrets entirely and grants no create/exec verbs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: claude-remote-debug
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: claude-remote-debug-view
subjects:
  - kind: ServiceAccount
    name: claude-remote-debug
    namespace: default
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io
---
# Read scope for remote debugging; see remote-debugging.md.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: claude-remote-debug-extended-read
rules:
  # Core "" omitted: it would grant Secrets.
  - apiGroups:
      - admissionregistration.k8s.io
      - apiextensions.k8s.io
      - apiregistration.k8s.io
      - apps
      - authentication.k8s.io
      - authorization.k8s.io
      - autoscaling
      - batch
      - certificates.k8s.io
      - coordination.k8s.io
      - discovery.k8s.io
      - events.k8s.io
      - flowcontrol.apiserver.k8s.io
      - metrics.k8s.io
      - networking.k8s.io
      - node.k8s.io
      - policy
      - rbac.authorization.k8s.io
      - scheduling.k8s.io
      - storage.k8s.io
      - acme.cert-manager.io
      - argoproj.io
      - cert-manager.io
      - helm.cattle.io
      - k3s.cattle.io
      - longhorn.io
      - metallb.io
      - monitoring.coreos.com
      - nfd.k8s-sigs.io
      - traefik.containo.us
      - traefik.io
      - upgrade.cattle.io
    resources: ["*"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: claude-remote-debug-extended-read
subjects:
  - kind: ServiceAccount
    name: claude-remote-debug
    namespace: default
roleRef:
  kind: ClusterRole
  name: claude-remote-debug-extended-read
  apiGroup: rbac.authorization.k8s.io
