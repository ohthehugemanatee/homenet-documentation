# ── calibre ────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: calibre
spec:
  selector:
    matchLabels:
      run: calibre
  replicas: 1
  serviceName: calibre
  volumeClaimTemplates:
    - metadata:
        name: calibre-config
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: "longhorn"
        resources:
          requests:
            storage: 10Gi
  template:
    metadata:
      labels:
        run: calibre
    spec:
      # calibre-web inherits this. Both images are published for amd64.
      nodeSelector:
        kubernetes.io/arch: amd64
      volumes:
        - name: nfs-media
          persistentVolumeClaim:
            claimName: media
      containers:
        - name: calibre
          image: lscr.io/linuxserver/calibre:v9.11.0-ls414
          resources:
            requests:
              memory: 1Gi
            limits:
              memory: 2Gi
              gpu.intel.com/i915: "1"
          ports:
            - containerPort: 8080   # KasmVNC GUI
            - containerPort: 8081   # Content / OPDS server
          env:
            - name: PGID
              value: "1000"
            - name: PUID
              value: "1000"
            - name: TZ
              value: "Europe/Berlin"
            - name: AUTO_GPU
              value: "true"
          volumeMounts:
            - name: calibre-config
              mountPath: /config
              subPath: "calibre"
            - name: nfs-media
              mountPath: /books
              subPath: "books"
          startupProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 30
            failureThreshold: 10  # 5 min grace; linuxserver s6-overlay + KasmVNC init
          livenessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 30
            failureThreshold: 3

        # Second container, not a second pod: calibre-web reads the same
        # SQLite library calibre writes. Two pods sharing it over NFS was the
        # hazard #254 removed, and a Longhorn RWO volume cannot be mounted
        # twice anyway.
        - name: calibre-web
          image: lscr.io/linuxserver/calibre-web:0.6.26-ls393
          ports:
            - containerPort: 8083
          env:
            - name: PGID
              value: "1000"
            - name: PUID
              value: "1000"
            - name: TZ
              value: "Europe/Berlin"
            - name: CALIBRE_PATH
              value: "/calibre-library/Calibre Library"
          volumeMounts:
            - name: calibre-config
              mountPath: /config
              subPath: "calibre-web"
            # Same subPath calibre mounts at /config, so this is literally the
            # directory calibre writes.
            - name: calibre-config
              mountPath: /calibre-library
              subPath: "calibre"
          startupProbe:
            tcpSocket:
              port: 8083
            periodSeconds: 30
            failureThreshold: 10  # 5 min grace; linuxserver s6-overlay init
          livenessProbe:
            tcpSocket:
              port: 8083
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 8083
            periodSeconds: 30
            failureThreshold: 3

---

apiVersion: v1
kind: Service
metadata:
  name: calibre
  labels:
    run: calibre
spec:
  ports:
  - name: gui
    port: 8080
    protocol: TCP
  - name: content
    port: 8081
    protocol: TCP
  selector:
    run: calibre

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: calibre
  annotations:
    traefik.ingress.kubernetes.io/redirect-entry-point: https
    ingress.kubernetes.io/hsts-max-age: "15552000"
    ingress.kubernetes.io/hsts-include-subdomains: "true"
    ingress.kubernetes.io/hsts-preload: "true"
spec:
  rules:
  - host: calibre.cluster.vert
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: calibre
            port:
              number: 8080
  - host: calibre.vert
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: calibre
            port:
              number: 8080
  - host: calibre.berlin.vertesi.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: calibre
            port:
              number: 8080
  tls:
  - hosts:
    - calibre.berlin.vertesi.com

# ── calibre-web (Service + Ingress; the container lives in the calibre pod) ──
---

apiVersion: v1
kind: Service
metadata:
  name: calibre-web
  labels:
    run: calibre-web
spec:
  ports:
  - port: 8083
    protocol: TCP
  # One pod serves both hostnames now, so this selects the calibre pod.
  selector:
    run: calibre

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: calibre-web
  annotations:
    traefik.ingress.kubernetes.io/redirect-entry-point: https
    ingress.kubernetes.io/hsts-max-age: "15552000"
    ingress.kubernetes.io/hsts-include-subdomains: "true"
    ingress.kubernetes.io/hsts-preload: "true"
spec:
  rules:
  - host: calibre-web.cluster.vert
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: calibre-web
            port:
              number: 8083
  - host: calibre-web.vert
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: calibre-web
            port:
              number: 8083
  - host: calibre-web.berlin.vertesi.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: calibre-web
            port:
              number: 8083
  tls:
  - hosts:
    - calibre-web.berlin.vertesi.com
