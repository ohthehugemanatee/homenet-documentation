apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: lidarr
  namespace: default
spec:
  selector:
    matchLabels:
      run: lidarr
  replicas: 1
  serviceName: lidarr
  volumeClaimTemplates:
    - metadata:
        name: lidarr-config
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: "longhorn"
        resources:
          requests:
            storage: 3Gi
  template:
    metadata:
      labels:
        run: lidarr
    spec:
      volumes:
        - name: nfs-media
          persistentVolumeClaim:
            claimName: media
      containers:
        - name: lidarr
          image: lscr.io/linuxserver/lidarr:3.1.0.4875-ls42
          ports:
            - containerPort: 8686
          env:
            - name: PGID
              value: "1000"
            - name: PUID
              value: "1000"
            - name: TZ
              value: "Europe/Berlin"
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: lidarr-config
              mountPath: /config
            - name: nfs-media
              mountPath: "/data"
          startupProbe:
            httpGet:
              path: /ping
              port: 8686
            periodSeconds: 30
            failureThreshold: 10  # 5 min grace; linuxserver s6-overlay init
          livenessProbe:
            httpGet:
              path: /ping
              port: 8686
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ping
              port: 8686
            periodSeconds: 30
            failureThreshold: 3

---

apiVersion: v1
kind: Service
metadata:
  name: lidarr
  namespace: default
  labels:
    run: lidarr
spec:
  ports:
  - port: 8686
    protocol: TCP
  selector:
    run: lidarr

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lidarr
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/redirect-entry-point: https
    ingress.kubernetes.io/hsts-max-age: "15552000"
    ingress.kubernetes.io/hsts-include-subdomains: "true"
    ingress.kubernetes.io/hsts-preload: "true"
spec:
  rules:
  - host: lidarr.cluster.vert
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: lidarr
            port:
              number: 8686
  - host: lidarr.berlin.vertesi.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: lidarr
            port:
              number: 8686
  tls:
  - hosts:
    - lidarr.berlin.vertesi.com
