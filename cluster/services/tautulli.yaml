---
# Plex activity monitor and watch-history archive. The Plex server URL and token
# are entered in Tautulli's own setup wizard on first run; neither is in git.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tautulli
  namespace: default
spec:
  selector:
    matchLabels:
      run: tautulli
  replicas: 1
  serviceName: tautulli
  volumeClaimTemplates:
    - metadata:
        name: tautulli-config
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: "longhorn"
        resources:
          requests:
            storage: 5Gi
  template:
    metadata:
      labels:
        run: tautulli
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
      containers:
        - name: tautulli
          image: lscr.io/linuxserver/tautulli:v2.18.1-ls242
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8181
          env:
            - name: PGID
              value: "1000"
            - name: PUID
              value: "1000"
            - name: TZ
              value: "Europe/Berlin"
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: tautulli-config
              mountPath: /config
          # /status is the one route Tautulli serves without auth and without
          # the first-run redirect to /welcome.
          startupProbe:
            httpGet:
              path: /status
              port: http
            periodSeconds: 10
            failureThreshold: 30  # 5 min grace; linuxserver s6-overlay init
          livenessProbe:
            httpGet:
              path: /status
              port: http
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /status
              port: http
            periodSeconds: 30
            failureThreshold: 3

---

apiVersion: v1
kind: Service
metadata:
  name: tautulli
  namespace: default
  labels:
    run: tautulli
spec:
  ports:
    - port: 8181
      protocol: TCP
      name: http
  selector:
    run: tautulli

---

# LAN only. Tautulli holds per-user viewing history, so it stays off the
# Cloudflare-fronted hosts that plex and ombi use.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tautulli
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/redirect-entry-point: https
    ingress.kubernetes.io/hsts-max-age: "15552000"
    ingress.kubernetes.io/hsts-include-subdomains: "true"
    ingress.kubernetes.io/hsts-preload: "true"
spec:
  rules:
    - host: tautulli.berlin.vertesi.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tautulli
                port:
                  number: 8181
  tls:
    - hosts:
        - tautulli.berlin.vertesi.com
